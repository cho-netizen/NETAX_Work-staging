<div class="view" id="view-reports">
  <div class="view-head"><h2>열람관리</h2><p style="color:var(--sub); font-size:12.5px; margin:2px 0 0;">rpt.netax.kr로 고객에게 보고서·자료를 열람 전용 링크로 제공합니다.</p></div>
  <div class="view-body">
    <div class="card">
      <h3>새 보고서 등록</h3>
      <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;">
        <div><label style="display:block; font-size:12px; color:var(--sub); margin-bottom:3px;">고객명 *</label>
          <input type="text" id="repNewName" style="width:120px;" placeholder="예: 홍길동"></div>
        <div><label style="display:block; font-size:12px; color:var(--sub); margin-bottom:3px;">명칭</label>
          <input type="text" id="repNewTitle" style="width:160px;" placeholder="예: 상속세 자문보고서"></div>
        <div><label style="display:block; font-size:12px; color:var(--sub); margin-bottom:3px;">유형</label>
          <input type="text" id="repNewType" list="repTypeOptions" style="width:130px;" placeholder="예: 자문보고서">
          <datalist id="repTypeOptions">
            <option value="자문보고서"><option value="신고보고서"><option value="참고보고서">
            <option value="진행보고서"><option value="처리보고서"><option value="청구서">
          </datalist>
        </div>
        <div style="flex:1; min-width:220px;"><label style="display:block; font-size:12px; color:var(--sub); margin-bottom:3px;">자료 링크(구글드라이브) *</label>
          <input type="text" id="repNewLink" style="width:100%;" placeholder="https://drive.google.com/..."></div>
        <div><label style="display:block; font-size:12px; color:var(--sub); margin-bottom:3px;">다운로드</label>
          <select id="repNewPermission" style="width:90px;"><option value="허용">허용</option><option value="차단">차단</option></select></div>
        <button type="button" id="repBtnRegister" class="save-btn">등록</button>
      </div>
      <div style="font-size:11.5px; color:var(--sub); margin-top:8px;">등록하면 그 파일이 자동으로 "링크가 있는 모든 사용자·보기"로 공유설정되고, 4자리 열람번호가 발급됩니다.</div>
    </div>

    <div class="card">
      <h3>등록된 보고서</h3>
      <div id="repList"><div class="spinner">불러오는 중…</div></div>
    </div>
  </div>
</div>

<script>
  var reportsLoaded = false;
  function initReports(){
    if (reportsLoaded) return;
    reportsLoaded = true;
    loadReportList();
  }

  function loadReportList(){
    var box = document.getElementById('repList');
    box.innerHTML = '<div class="spinner">불러오는 중…</div>';
    callGas('admin_list', {}).then(function(res){
      if (res.error || res.success === false){ box.innerHTML = '<div class="empty-row">' + escapeHtml(res.message || res.error || '불러오지 못했습니다.') + '</div>'; return; }
      var list = res.customers || [];
      window._reportListCache = list;
      if (!list.length){ box.innerHTML = '<div class="empty-row">등록된 보고서가 없습니다.</div>'; return; }
      list.sort(function(a, b){ return String(b.issued).localeCompare(String(a.issued)); });
      var html = '<table class="list-table"><tr><th>고객명</th><th>명칭</th><th>열람번호</th><th>발급일</th><th>만료일</th>' +
        '<th>열람</th><th>처리</th></tr>';
      list.forEach(function(r){
        var expiredBadge = r.is_expired ? ' <span style="color:var(--danger);">(만료)</span>' : '';
        var accessInfo = r.access_count ? (r.access_count + '회, 최근 ' + fmtDateShort_((r.last_access||'').slice(0,10))) : '미열람';
        html += '<tr><td>' + esc_(r.name) + '</td><td>' + esc_(r.title) + '</td><td><code>' + esc_(r.report_id) + '</code></td>' +
          '<td>' + esc_(fmtIssuedDate_(r.issued)) + '</td><td>' + esc_(fmtIssuedDate_(r.expiry)) + expiredBadge + '</td>' +
          '<td style="font-size:12px; color:var(--sub);">' + esc_(accessInfo) + '</td>' +
          '<td><button type="button" class="btn" data-act="copy" data-id="' + esc_(r.report_id) + '">🔗 링크복사</button> ' +
          '<button type="button" class="btn" data-act="reset" data-id="' + esc_(r.report_id) + '">비번초기화</button> ' +
          '<button type="button" class="btn danger" data-act="del" data-id="' + esc_(r.report_id) + '">삭제</button></td></tr>';
      });
      html += '</table>';
      box.innerHTML = html;

      box.querySelectorAll('button[data-act]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var act = btn.dataset.act, id = btn.dataset.id;
          if (act === 'copy'){
            var url = 'https://rpt.netax.kr/?report_id=' + id;
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){ toast('열람 링크를 복사했습니다: ' + url); });
            else toast(url);
          } else if (act === 'reset'){
            if (!confirm('이 보고서의 비밀번호를 초기화할까요? 고객이 다음 접속 시 새로 설정합니다.')) return;
            callGas('clear_password', { report_id: id }).then(function(res){
              if (res.error || res.success === false){ toast(res.message || res.error || '초기화 실패'); return; }
              toast('비밀번호를 초기화했습니다.');
            });
          } else if (act === 'del'){
            if (!confirm('이 보고서 등록을 삭제할까요? 열람번호가 즉시 무효화됩니다.')) return;
            callGas('delete_report', { report_id: id }).then(function(res){
              if (res.error || res.success === false){ toast(res.message || res.error || '삭제 실패'); return; }
              toast('삭제했습니다.');
              loadReportList();
            });
          }
        });
      });
    }).catch(function(){ box.innerHTML = '<div class="empty-row">불러오지 못했습니다.</div>'; });
  }

  function esc_(s){ return escapeHtml(s == null ? '' : s); }
  function fmtIssuedDate_(v){
    if (!v) return '';
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v)) return fmtDateShort_(v.slice(0, 10));
    try { var d = new Date(v); if (!isNaN(d.getTime())) return fmtDateShort_(d.toISOString().slice(0, 10)); } catch(e){}
    return String(v);
  }

  document.getElementById('repBtnRegister').addEventListener('click', function(){
    var name = document.getElementById('repNewName').value.trim();
    var link = document.getElementById('repNewLink').value.trim();
    if (!name){ toast('고객명을 입력해주세요.'); return; }
    if (!link){ toast('자료 링크를 입력해주세요.'); return; }
    var btn = document.getElementById('repBtnRegister');
    btn.disabled = true; btn.textContent = '등록 중…';
    callGas('report_register', {
      name: name,
      title: document.getElementById('repNewTitle').value.trim(),
      type: document.getElementById('repNewType').value.trim(),
      link: link,
      permission: document.getElementById('repNewPermission').value
    }).then(function(res){
      if (res.error){ toast('등록 실패: ' + res.error); return; }
      toast('등록했습니다 — 열람번호 ' + res.report_id + (res.공유설정 ? ' · ' + res.공유설정 : ''));
      document.getElementById('repNewName').value = '';
      document.getElementById('repNewTitle').value = '';
      document.getElementById('repNewType').value = '';
      document.getElementById('repNewLink').value = '';
      loadReportList();
    }).catch(function(err){ toast('등록 중 오류: ' + (err && err.message ? err.message : err)); })
      .finally(function(){ btn.disabled = false; btn.textContent = '등록'; });
  });
</script>
