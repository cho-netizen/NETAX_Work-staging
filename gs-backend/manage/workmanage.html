<div class="view" id="view-workmanage">
  <div class="editor-toolbar">
    <button type="button" id="btnWorkCaseNew" class="save-btn">+ 새 사건</button>
    <span class="editor-filename">🗂 사건별 세부업무 · 법정기한</span>
    <div class="spacer"></div>
    <select id="workCaseFilterStatus" title="상태로 필터">
      <option value="">전체</option>
      <option value="진행">진행</option>
      <option value="보류">보류</option>
      <option value="완료">완료</option>
    </select>
  </div>
  <div class="manage-split">
    <div class="manage-split-list"><div id="workCaseList" class="log-list"></div></div>
    <div class="manage-split-detail">
      <div id="workCaseDetail"><div class="explorer-status">왼쪽에서 사건을 선택하거나 "+ 새 사건"을 눌러주세요.</div></div>
    </div>
  </div>
</div>
<datalist id="clientNameOptions"></datalist>

<script>
  // ============================================================
  // 작업관리 — work-manage.js 이식본. 기존 앱과 로직은 100% 동일하고,
  // 탐색창/새창 전환 관련 코드만 이 앱의 메뉴 라우팅(showView)에 맞춰 걷어냈다.
  // ============================================================
  var workCaseList = document.getElementById('workCaseList');
  var workCaseDetail = document.getElementById('workCaseDetail');
  var workCaseFilterStatus = document.getElementById('workCaseFilterStatus');

  var WORK_SEMOK_LABELS = { transfer: '양도', gift: '증여', inheritance: '상속', objection: '불복' };
  var WORK_STATUS_OPTIONS = ['진행', '보류', '완료'];
  var WORK_SUBTASK_STATUS_OPTIONS = ['대기', '진행', '보류', '완료'];
  var WORK_UPTYPE_OPTIONS_ = {
    transfer: ['신고', '상담'],
    gift: ['신고', '상담'],
    inheritance: ['신고', '상담'],
    objection: ['이의신청', '심사청구', '심판청구', '행정소송', '경정청구', '과세적부', '해명자료']
  };
  var WORK_MANUAL_DEADLINE_TYPES_ = ['상담', '해명자료'];

  function workDeadlineFieldLabel_(upType){
    return WORK_MANUAL_DEADLINE_TYPES_.indexOf(upType) !== -1 ? '처리시한' : '법정일';
  }

  function workDefaultManualDeadline_(requestDateStr){
    var base = requestDateStr ? new Date(requestDateStr + 'T00:00:00') : new Date();
    if (isNaN(base.getTime())) return '';
    base.setDate(base.getDate() + 7);
    var y = base.getFullYear();
    var m = String(base.getMonth() + 1).padStart(2, '0');
    var d = String(base.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  var workCases = [];
  var workSelectedCaseId = null;
  var workShowingNewForm = false;
  var workManageLoaded = false;

  function initWorkManage(){
    if (workManageLoaded) return;
    workManageLoaded = true;
    loadWorkCases();
  }

  function loadWorkCases(){
    workCaseList.innerHTML = '<div class="log-empty">불러오는 중…</div>';
    callGas('work_get_cases', {}).then(function(res){
      if (res.error || res.success === false){
        workCaseList.innerHTML = '<div class="log-empty">' + escapeHtml(res.error || res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      workCases = res.cases || [];
      renderWorkCaseList();
      if (workSelectedCaseId){
        var still = workCases.filter(function(c){ return c.id === workSelectedCaseId; })[0];
        if (still) { renderWorkCaseDetail(still); return; }
      }
      if (!workShowingNewForm){
        workCaseDetail.innerHTML = '<div class="explorer-status">왼쪽에서 사건을 선택하거나 "+ 새 사건"을 눌러주세요.</div>';
      }
    }).catch(function(){
      workCaseList.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>';
    });
  }

  function workProgress(caseObj){
    var total = 0, done = 0;
    (function walk(nodes){
      (nodes || []).forEach(function(n){
        total++;
        if (n.status === '완료') done++;
        walk(n.children);
      });
    })(caseObj.하위업무);
    return { total: total, done: done };
  }

  function renderWorkCaseList(){
    var filter = workCaseFilterStatus.value;
    var filtered = workCases.filter(function(c){ return !filter || c.상태 === filter; });
    workCaseList.innerHTML = '';
    if (!filtered.length){
      workCaseList.innerHTML = '<div class="log-empty">등록된 사건이 없습니다.</div>';
      return;
    }
    var todayStr = new Date().toISOString().slice(0, 10);
    filtered.slice().sort(function(a, b){ return (a.법정일 || '9999').localeCompare(b.법정일 || '9999'); }).forEach(function(c){
      var prog = workProgress(c);
      var overdue = c.법정일 && c.법정일 < todayStr && c.상태 !== '완료';
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.style.cursor = 'pointer';
      if (c.id === workSelectedCaseId) row.style.outline = '2px solid var(--navy)';
      var noDeadlineText = workDeadlineFieldLabel_(c.업무유형) === '처리시한' ? '시한없음' : '기한없음';
      var dateStyle = c.상태 === '완료' ? ' style="color:var(--sub);"' : '';
      row.innerHTML =
        '<div class="log-date"' + dateStyle + '>' + (overdue ? '<span style="color:#a83232;">⏰</span> ' : '') + escapeHtml(c.법정일 ? fmtDateShort_(c.법정일) : noDeadlineText) + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(c.고객명 || '(고객명 없음)') + '</b> · ' + escapeHtml(c.사건명 || '') +
        '<br><span style="color:var(--sub); font-size:12px;">' + escapeHtml(WORK_SEMOK_LABELS[c.세목] || c.세목 || '') + (c.업무유형 ? ' · ' + escapeHtml(c.업무유형) : '') + ' · ' + escapeHtml(c.상태 || '') +
        (prog.total ? (' · 하위업무 ' + prog.done + '/' + prog.total) : '') + '</span></div>';
      row.addEventListener('click', function(){ workShowingNewForm = false; workSelectedCaseId = c.id; renderWorkCaseList(); renderWorkCaseDetail(c); });
      workCaseList.appendChild(row);
    });
  }

  function renderNewCaseForm(){
    workShowingNewForm = true;
    workSelectedCaseId = null;
    renderWorkCaseList();
    workCaseDetail.innerHTML =
      '<h3 style="margin-top:0;">새 사건 등록</h3>' +
      '<div style="display:flex; flex-direction:column; gap:8px; max-width:420px;">' +
      '<label>고객명(의뢰인)<br><input type="text" id="wcNewCustomer" list="clientNameOptions" style="width:100%;" placeholder="고객명 (신규면 자동으로 고객관리에도 등록됩니다)"></label>' +
      '<label>납세자 <span style="color:var(--sub); font-weight:400;">(의뢰인과 다른 경우만 입력)</span><br><input type="text" id="wcNewTaxpayer" style="width:100%;" placeholder="(선택) 의뢰인과 같으면 비워두세요"></label>' +
      '<label>사건명<br><input type="text" id="wcNewCase" style="width:100%;" placeholder="예: 2026년 양도소득세 신고"></label>' +
      '<label>세목<br><select id="wcNewSemok" style="width:100%;">' +
        Object.keys(WORK_SEMOK_LABELS).map(function(k){ return '<option value="' + k + '">' + WORK_SEMOK_LABELS[k] + '</option>'; }).join('') +
      '</select></label>' +
      '<label>업무유형<br><select id="wcNewUptype" style="width:100%;"></select></label>' +
      '<label>담당자<br><input type="text" id="wcNewAssignee" style="width:100%;" placeholder="(선택)"></label>' +
      '<label>의뢰일<br><input type="date" id="wcNewRequestDate" style="width:100%;"></label>' +
      '<label>기준일 <span id="wcNewBaseDateHint" style="color:var(--sub); font-weight:400;">(양도일·증여일·사망일 등)</span><br><input type="date" id="wcNewBaseDate" style="width:100%;"></label>' +
      '<label id="wcNewManualDeadlineLabel" style="display:none;"><span id="wcNewManualDeadlineText">처리시한</span><br><input type="date" id="wcNewManualDeadline" style="width:100%;"></label>' +
      '<label>처리방향<br><textarea id="wcNewOverview" style="width:100%; min-height:60px; font-family:inherit; box-sizing:border-box;" placeholder="어떻게 처리할 계획인지"></textarea></label>' +
      '<div style="display:flex; gap:8px; margin-top:8px;">' +
      '<button type="button" id="wcNewSave" class="save-btn">저장</button>' +
      '<button type="button" id="wcNewCancel" class="ghost-btn">취소</button>' +
      '</div></div>';

    var newSemokSel = document.getElementById('wcNewSemok');
    var newUptypeSel = document.getElementById('wcNewUptype');

    function refillNewUptype(){
      var options = WORK_UPTYPE_OPTIONS_[newSemokSel.value] || [];
      newUptypeSel.innerHTML = options.map(function(u){ return '<option value="' + u + '">' + u + '</option>'; }).join('');
      onNewUptypeChange();
    }
    function onNewUptypeChange(){
      var manual = WORK_MANUAL_DEADLINE_TYPES_.indexOf(newUptypeSel.value) !== -1;
      document.getElementById('wcNewBaseDateHint').textContent = newSemokSel.value === 'objection' ? '(고지서 수령일 등 기산일)' : '(양도일·증여일·사망일 등)';
      var manualLabel = document.getElementById('wcNewManualDeadlineLabel');
      manualLabel.style.display = manual ? '' : 'none';
      if (manual){
        document.getElementById('wcNewManualDeadlineText').textContent = workDeadlineFieldLabel_(newUptypeSel.value);
        var deadlineInput = document.getElementById('wcNewManualDeadline');
        if (!deadlineInput.value) deadlineInput.value = workDefaultManualDeadline_(document.getElementById('wcNewRequestDate').value);
      }
    }
    newSemokSel.addEventListener('change', refillNewUptype);
    newUptypeSel.addEventListener('change', onNewUptypeChange);
    refillNewUptype();

    document.getElementById('wcNewCancel').addEventListener('click', function(){
      workShowingNewForm = false;
      workCaseDetail.innerHTML = '<div class="explorer-status">왼쪽에서 사건을 선택하거나 "+ 새 사건"을 눌러주세요.</div>';
    });
    document.getElementById('wcNewSave').addEventListener('click', function(){
      var 고객명 = document.getElementById('wcNewCustomer').value.trim();
      var 사건명 = document.getElementById('wcNewCase').value.trim();
      if (!고객명 || !사건명){ showToast('고객명과 사건명을 입력해주세요.', 'warning'); return; }
      var upType = newUptypeSel.value;
      var manual = WORK_MANUAL_DEADLINE_TYPES_.indexOf(upType) !== -1;
      var payload = {
        고객명: 고객명, 사건명: 사건명,
        납세자: document.getElementById('wcNewTaxpayer').value.trim(),
        세목: newSemokSel.value,
        업무유형: upType,
        담당자: document.getElementById('wcNewAssignee').value.trim(),
        의뢰일: document.getElementById('wcNewRequestDate').value,
        기준일: document.getElementById('wcNewBaseDate').value,
        개요: document.getElementById('wcNewOverview').value.trim()
      };
      if (manual) payload.법정일 = document.getElementById('wcNewManualDeadline').value;
      callGas('work_create_case', payload).then(function(res){
        if (res.error || res.success === false){ showToast(res.error || res.message || '저장 실패', 'error'); return; }
        showToast('사건을 등록했습니다.', 'success');
        workShowingNewForm = false;
        workSelectedCaseId = res.case.id;
        loadWorkCases();
        if (typeof loadClientsQuiet_ === 'function') loadClientsQuiet_();
      }).catch(function(){ showToast('저장 중 오류가 발생했습니다.', 'error'); });
    });
  }

  function renderWorkCaseDetail(c){
    var prog = workProgress(c);
    var isManual = WORK_MANUAL_DEADLINE_TYPES_.indexOf(c.업무유형) !== -1;
    workCaseDetail.innerHTML =
      '<div style="display:flex; justify-content:space-between; align-items:flex-start;">' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0;">' +
      '<input type="text" id="wcEditCustomerName" placeholder="고객명" value="' + escapeHtml(c.고객명 || '') + '" style="font-weight:700; font-size:15px; width:120px;">' +
      '<button type="button" id="wcViewCustomer" class="ghost-btn" title="이 고객 정보 빠르게 보기·수정" style="padding:4px 8px;">👤</button>' +
      '<input type="text" id="wcEditTaxpayer" placeholder="납세자(의뢰인과 다르면 입력)" value="' + escapeHtml(c.납세자 || '') + '" style="width:140px;">' +
      '<input type="text" id="wcEditCaseName" placeholder="사건명" value="' + escapeHtml(c.사건명 || '') + '" style="font-weight:700; font-size:15px; width:160px;">' +
      '</div>' +
      '<button type="button" id="wcDeleteCase" class="ghost-btn" title="삭제">🗑 삭제</button>' +
      '</div>' +
      '<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; margin-top:8px;">' +
      '<select id="wcEditSemok">' + Object.keys(WORK_SEMOK_LABELS).map(function(k){ return '<option value="' + k + '"' + (k === c.세목 ? ' selected' : '') + '>' + WORK_SEMOK_LABELS[k] + '</option>'; }).join('') + '</select>' +
      '<select id="wcEditUptype"></select>' +
      '<input type="text" id="wcEditAssignee" placeholder="담당자" value="' + escapeHtml(c.담당자 || '') + '" style="width:100px;">' +
      '<label style="font-size:12px; color:var(--sub);">의뢰일 <input type="date" id="wcEditRequestDate" value="' + escapeHtml(c.의뢰일 || '') + '"></label>' +
      '<label style="font-size:12px; color:var(--sub);">기준일 <input type="date" id="wcEditBaseDate" value="' + escapeHtml(c.기준일 || '') + '"></label>' +
      '<select id="wcEditStatus">' + WORK_STATUS_OPTIONS.map(function(s){ return '<option value="' + s + '"' + (s === c.상태 ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
      '<button type="button" id="wcSaveCase" class="ghost-btn">저장</button>' +
      '</div>' +
      '<div style="margin-bottom:12px;">' +
      '<span id="wcEditDeadlineAuto" style="display:' + (isManual ? 'none' : 'inline-block') + '; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 10px; font-size:12.5px; color:var(--sub);">' + workDeadlineFieldLabel_(c.업무유형) + ': <b style="color:var(--navy);">' + (c.법정일 ? escapeHtml(fmtDateShort_(c.법정일)) : '(기준일을 입력하면 자동 계산)') + '</b></span>' +
      '<label id="wcEditManualDeadlineLabel" style="display:' + (isManual ? 'inline-block' : 'none') + '; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 10px; font-size:12.5px; color:var(--sub);"><span id="wcEditManualDeadlineText">처리시한</span> <input type="date" id="wcEditManualDeadline" value="' + escapeHtml(c.법정일 || '') + '"></label>' +
      '</div>' +
      '<div style="margin-bottom:14px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; max-width:600px;">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📋 사건처리개시 — 처리대상 · 처리방향</div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">처리대상 <span style="font-weight:400;">(무엇을 처리하는지)</span></label>' +
      '<input type="text" id="wcEditTarget" placeholder="예: OO아파트 매각건의 양도소득세 신고" value="' + escapeHtml(c.처리대상 || '') + '" style="width:100%; box-sizing:border-box; margin-bottom:8px;">' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">처리방향 <span style="font-weight:400;">(법령·예규·판례를 검토해 어떻게 처리할지)</span></label>' +
      '<textarea id="wcEditDirection" placeholder="예: 1세대1주택 비과세 요건 충족 여부 검토 후 신고" style="width:100%; min-height:50px; font-family:inherit; font-size:13px; box-sizing:border-box;">' + escapeHtml(c.처리방향 || '') + '</textarea>' +
      '</div>' +
      '<div style="margin-bottom:14px;">' +
      '<label id="wcEditOverviewLabel" style="font-size:12.5px; color:var(--sub); display:block; margin-bottom:4px;">' + (c.상태 === '완료' ? '처리내용' : '진행메모') + '</label>' +
      '<textarea id="wcEditOverview" placeholder="' + (c.상태 === '완료' ? '실제로 어떻게 처리했는지' : '진행하면서 남길 메모') + '" style="width:100%; max-width:600px; min-height:60px; font-family:inherit; font-size:13px; box-sizing:border-box;">' + escapeHtml(c.개요 || '') + '</textarea>' +
      '</div>' +
      '<div id="wcAddRootToggle" style="font-size:12.5px; color:var(--sub); margin-bottom:8px; cursor:pointer; width:fit-content;" title="눌러서 새 하위업무 추가">➕ 하위업무 ' + prog.done + ' / ' + prog.total + '</div>' +
      '<div id="wcNewRootFormWrap" style="display:none; gap:6px; margin-bottom:10px; flex-wrap:wrap;"></div>' +
      '<div id="wcTree"></div>' +
      '<div style="margin-top:20px; padding-top:14px; border-top:1px solid var(--line);">' +
      '<div id="wcLogToggle" style="font-size:12.5px; color:var(--sub); margin-bottom:8px; cursor:pointer; width:fit-content;" title="눌러서 작업일지 추가">📓 작업일지 ' + (c.작업일지 || []).length + '건</div>' +
      '<div id="wcNewLogFormWrap" style="display:none; gap:6px; margin-bottom:10px; flex-wrap:wrap;"></div>' +
      '<div id="wcLogList"></div>' +
      '</div>' +
      '<div style="margin-top:20px; padding-top:14px; border-top:1px solid var(--line); max-width:600px;">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">⚖️ 법령예규판례</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<select id="wcLawCategory" style="width:120px;"><option value="precedent">판례</option><option value="interpretation">법령해석례</option><option value="administrative_rule">행정규칙</option></select>' +
      '<input type="text" id="wcLawQuery" placeholder="검색어 (예: 1세대1주택 비과세)" style="flex:1; min-width:160px;">' +
      '<button type="button" id="wcLawSearchBtn" class="ghost-btn">검색</button>' +
      '</div>' +
      '<div id="wcLawResults"></div>' +
      '<div id="wcLawAttachedWrap" style="margin-top:12px;">' +
      '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">이 사건에 첨부된 자료</div>' +
      '<div id="wcLawAttached"></div>' +
      '</div>' +
      '</div>';

    renderWorkTree(c.하위업무 || [], document.getElementById('wcTree'), c.id, 0);
    renderWorkLog_(c);
    initWorkLawSection_(c);

    var newRootFormWrap = document.getElementById('wcNewRootFormWrap');
    document.getElementById('wcAddRootToggle').addEventListener('click', function(){
      if (newRootFormWrap.style.display === 'none'){
        newRootFormWrap.style.display = 'flex';
        newRootFormWrap.innerHTML =
          '<input type="text" id="wcNewRootTitle" placeholder="새 하위업무 (예: 자료수집)" style="flex:1; min-width:160px;">' +
          '<input type="date" id="wcNewRootDue" title="마감일(선택)">' +
          '<button type="button" id="wcAddRoot" class="save-btn">추가</button>' +
          '<button type="button" id="wcAddRootCancel" class="ghost-btn">취소</button>';
        document.getElementById('wcAddRootCancel').addEventListener('click', function(){ newRootFormWrap.style.display = 'none'; newRootFormWrap.innerHTML = ''; });
        document.getElementById('wcAddRoot').addEventListener('click', function(){
          var t = document.getElementById('wcNewRootTitle').value.trim();
          if (!t){ showToast('항목 이름을 입력해주세요.', 'warning'); return; }
          addWorkSubtask(c.id, null, t, document.getElementById('wcNewRootDue').value);
        });
      } else {
        newRootFormWrap.style.display = 'none';
        newRootFormWrap.innerHTML = '';
      }
    });

    document.getElementById('wcViewCustomer').addEventListener('click', function(){
      if (typeof openClientQuickView_ === 'function') openClientQuickView_(c.고객ID);
    });

    var newLogFormWrap = document.getElementById('wcNewLogFormWrap');
    document.getElementById('wcLogToggle').addEventListener('click', function(){
      if (newLogFormWrap.style.display === 'none'){
        newLogFormWrap.style.display = 'flex';
        var todayStr = new Date().toISOString().slice(0, 10);
        newLogFormWrap.innerHTML =
          '<input type="date" id="wcNewLogDate" value="' + todayStr + '" style="width:130px;">' +
          '<input type="text" id="wcNewLogText" placeholder="진행 내용 · 다음 할일" style="flex:1; min-width:160px;">' +
          '<input type="date" id="wcNewLogDue" title="다음 일정(선택) — 입력하면 캘린더에 등록됩니다">' +
          '<button type="button" id="wcAddLog" class="save-btn">추가</button>' +
          '<button type="button" id="wcAddLogCancel" class="ghost-btn">취소</button>';
        document.getElementById('wcAddLogCancel').addEventListener('click', function(){ newLogFormWrap.style.display = 'none'; newLogFormWrap.innerHTML = ''; });
        document.getElementById('wcAddLog').addEventListener('click', function(){
          var text = document.getElementById('wcNewLogText').value.trim();
          if (!text){ showToast('내용을 입력해주세요.', 'warning'); return; }
          var entry = {
            id: 'log_' + Date.now(),
            date: document.getElementById('wcNewLogDate').value || todayStr,
            text: text,
            dueDate: document.getElementById('wcNewLogDue').value || ''
          };
          var newLog = (c.작업일지 || []).concat([entry]);
          saveWorkLog_(c.id, newLog);
        });
      } else {
        newLogFormWrap.style.display = 'none';
        newLogFormWrap.innerHTML = '';
      }
    });

    var editSemokSel = document.getElementById('wcEditSemok');
    var editUptypeSel = document.getElementById('wcEditUptype');

    var editUptypePrevWasManual = WORK_MANUAL_DEADLINE_TYPES_.indexOf(c.업무유형) !== -1;
    function refillEditUptype(keepCurrent){
      var options = WORK_UPTYPE_OPTIONS_[editSemokSel.value] || [];
      var current = keepCurrent && options.indexOf(c.업무유형) !== -1 ? c.업무유형 : options[0];
      editUptypeSel.innerHTML = options.map(function(u){ return '<option value="' + u + '"' + (u === current ? ' selected' : '') + '>' + u + '</option>'; }).join('');
      onEditUptypeChange();
    }
    function onEditUptypeChange(){
      var manual = WORK_MANUAL_DEADLINE_TYPES_.indexOf(editUptypeSel.value) !== -1;
      document.getElementById('wcEditDeadlineAuto').style.display = manual ? 'none' : 'inline-block';
      document.getElementById('wcEditManualDeadlineLabel').style.display = manual ? 'inline-block' : 'none';
      if (manual){
        document.getElementById('wcEditManualDeadlineText').textContent = workDeadlineFieldLabel_(editUptypeSel.value);
        var deadlineInput = document.getElementById('wcEditManualDeadline');
        if (!editUptypePrevWasManual || !deadlineInput.value) deadlineInput.value = workDefaultManualDeadline_(document.getElementById('wcEditRequestDate').value);
      }
      editUptypePrevWasManual = manual;
    }
    editSemokSel.addEventListener('change', function(){ refillEditUptype(false); });
    editUptypeSel.addEventListener('change', onEditUptypeChange);
    refillEditUptype(true);

    function saveCaseNow_(silent){
      var customerName = document.getElementById('wcEditCustomerName').value.trim();
      var caseName = document.getElementById('wcEditCaseName').value.trim();
      if (!customerName || !caseName){ showToast('고객명과 사건명은 비워둘 수 없습니다.', 'warning'); return; }
      var upType = editUptypeSel.value;
      var manual = WORK_MANUAL_DEADLINE_TYPES_.indexOf(upType) !== -1;
      var payload = {
        id: c.id,
        고객명: customerName,
        사건명: caseName,
        납세자: document.getElementById('wcEditTaxpayer').value.trim(),
        세목: editSemokSel.value,
        업무유형: upType,
        담당자: document.getElementById('wcEditAssignee').value.trim(),
        의뢰일: document.getElementById('wcEditRequestDate').value,
        기준일: document.getElementById('wcEditBaseDate').value,
        상태: document.getElementById('wcEditStatus').value,
        개요: document.getElementById('wcEditOverview').value.trim(),
        처리대상: document.getElementById('wcEditTarget').value.trim(),
        처리방향: document.getElementById('wcEditDirection').value.trim()
      };
      if (manual) payload.법정일 = document.getElementById('wcEditManualDeadline').value;
      callGas('work_update_case', payload).then(function(res){
        if (res.error || res.success === false){ showToast(res.error || res.message || '저장 실패', 'error'); return; }
        if (!silent) showToast('저장했습니다.', 'success');
        loadWorkCases();
      }).catch(function(){ showToast('저장 중 오류가 발생했습니다.', 'error'); });
    }
    document.getElementById('wcSaveCase').addEventListener('click', function(){ saveCaseNow_(false); });
    document.getElementById('wcEditStatus').addEventListener('change', function(){ saveCaseNow_(true); });

    document.getElementById('wcDeleteCase').addEventListener('click', function(){
      if (!confirm('"' + c.사건명 + '" 사건을 삭제할까요? 하위업무와 캘린더 일정도 함께 지워집니다.')) return;
      callGas('work_delete_case', { id: c.id }).then(function(res){
        if (res.error || res.success === false){ showToast(res.error || res.message || '삭제 실패', 'error'); return; }
        workSelectedCaseId = null;
        showToast('삭제했습니다.', 'success');
        loadWorkCases();
      }).catch(function(){ showToast('삭제 중 오류가 발생했습니다.', 'error'); });
    });
  }

  function saveWorkLog_(caseId, newLog){
    callGas('work_update_case', { id: caseId, 작업일지: newLog }).then(function(res){
      if (res.error || res.success === false){ showToast(res.error || res.message || '저장 실패', 'error'); return; }
      loadWorkCases();
    }).catch(function(){ showToast('저장 중 오류가 발생했습니다.', 'error'); });
  }

  function renderWorkLog_(c){
    var list = document.getElementById('wcLogList');
    if (!list) return;
    var entries = (c.작업일지 || []).slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
    if (!entries.length){
      list.innerHTML = '<div class="log-empty">아직 작업일지가 없습니다.</div>';
      return;
    }
    list.innerHTML = '';
    entries.forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.innerHTML =
        '<div class="log-date">' + escapeHtml(fmtDateShort_(entry.date) || entry.date || '') + '</div>' +
        '<div class="log-text">' + escapeHtml(entry.text || '') +
        (entry.dueDate ? ' <span style="color:var(--sub); font-size:12px;">— 다음: ' + escapeHtml(fmtDateShort_(entry.dueDate)) + '</span>' : '') + '</div>' +
        '<span class="log-del" title="삭제">✕</span>';
      row.querySelector('.log-del').addEventListener('click', function(){
        var newLog = (c.작업일지 || []).filter(function(e){ return e.id !== entry.id; });
        saveWorkLog_(c.id, newLog);
      });
      list.appendChild(row);
    });
  }

  // ============================================================
  // 2단계 — 법령예규판례: law_search_precedent/law_get_precedent_detail(law.go.kr, AI 경유 없이
  // 직접 호출)로 검색·첨부. 첨부 시 상세조회 결과의 핵심 필드를 요약으로 잘라 case의
  // 법령예규판례 배열에 저장한다(작업일지와 같은 "배열 통째로 다시 저장" 방식).
  // ============================================================
  var WORK_LAW_CATEGORY_LABELS_ = { precedent: '판례', interpretation: '법령해석례', administrative_rule: '행정규칙' };

  function wcLawResultTitle_(category, item){
    if (category === 'precedent') return { title: item.사건명 || '(제목 없음)', sub: [item.사건번호, item.선고일자, item.법원명].filter(Boolean).join(' · ') };
    if (category === 'interpretation') return { title: item.안건명 || '(제목 없음)', sub: [item.안건번호, item.회신일자, item.질의기관].filter(Boolean).join(' · ') };
    return { title: item.행정규칙명 || '(제목 없음)', sub: [item.행정규칙종류, item.발령일자, item.소관부처].filter(Boolean).join(' · ') };
  }

  function wcLawDetailSummary_(category, detail){
    var text = category === 'precedent' ? (detail.판결요지 || detail.판시사항 || '')
      : category === 'interpretation' ? (detail.회답 || detail.질의요지 || '')
      : (detail.내용 || '');
    text = String(text).trim();
    return text.length > 300 ? text.slice(0, 300) + '…' : text;
  }

  function saveWorkPrecedents_(caseId, newList){
    return callGas('work_update_case', { id: caseId, 법령예규판례: newList }).then(function(res){
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return null; }
      loadWorkCases();
      return res;
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); return null; });
  }

  function renderAttachedPrecedents_(c){
    var wrap = document.getElementById('wcLawAttached');
    if (!wrap) return;
    var list = c.법령예규판례 || [];
    if (!list.length){
      wrap.innerHTML = '<div class="log-empty">아직 첨부된 자료가 없습니다.</div>';
      return;
    }
    wrap.innerHTML = '';
    list.slice().reverse().forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.innerHTML =
        '<div class="log-date">' + escapeHtml(WORK_LAW_CATEGORY_LABELS_[entry.category] || entry.category) + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.제목 || '') + '</b>' +
        (entry.요약 ? '<br><span style="color:var(--sub); font-size:12.5px;">' + escapeHtml(entry.요약) + '</span>' : '') + '</div>' +
        '<span class="log-del" title="첨부 해제">✕</span>';
      row.querySelector('.log-del').addEventListener('click', function(){
        var newList = list.filter(function(e){ return !(e.category === entry.category && e.id === entry.id); });
        saveWorkPrecedents_(c.id, newList);
      });
      wrap.appendChild(row);
    });
  }

  function initWorkLawSection_(c){
    renderAttachedPrecedents_(c);
    var resultsBox = document.getElementById('wcLawResults');
    var categorySel = document.getElementById('wcLawCategory');
    var queryInput = document.getElementById('wcLawQuery');

    function runSearch(){
      var query = queryInput.value.trim();
      if (!query){ showToast('검색어를 입력해주세요.', 'warning'); return; }
      var category = categorySel.value;
      resultsBox.innerHTML = '<div class="log-empty">검색 중…</div>';
      callGas('law_search_precedent', { category: category, query: query }).then(function(res){
        var items = res.results || [];
        if (!items.length){ resultsBox.innerHTML = '<div class="log-empty">' + escapeHtml(res.message || '검색 결과가 없습니다.') + '</div>'; return; }
        resultsBox.innerHTML = '';
        items.forEach(function(item){
          var t = wcLawResultTitle_(category, item);
          var row = document.createElement('div');
          row.className = 'log-entry';
          row.innerHTML =
            '<div class="log-text" style="flex:1;"><b>' + escapeHtml(t.title) + '</b>' +
            (t.sub ? '<br><span style="color:var(--sub); font-size:12px;">' + escapeHtml(t.sub) + '</span>' : '') + '</div>' +
            '<button type="button" class="ghost-btn wcLawAttachBtn" style="padding:3px 8px; font-size:12px;">➕ 첨부</button>';
          row.querySelector('.wcLawAttachBtn').addEventListener('click', function(){
            var attachBtn = row.querySelector('.wcLawAttachBtn');
            attachBtn.disabled = true;
            attachBtn.textContent = '조회 중…';
            function doAttach_(요약){
              var entry = { category: category, id: item.id, 제목: t.title, 요약: 요약, 첨부일: new Date().toISOString().slice(0, 10) };
              var already = (c.법령예규판례 || []).some(function(e){ return e.category === entry.category && e.id === entry.id; });
              if (already){ showToast('이미 첨부된 자료입니다.', 'warning'); attachBtn.disabled = false; attachBtn.textContent = '➕ 첨부'; return; }
              var newList = (c.법령예규판례 || []).concat([entry]);
              saveWorkPrecedents_(c.id, newList);
            }
            // 원문 조회가 실패해도(정부 데이터베이스에 원문이 없는 항목이 실제로 많음) 검색결과의
            // 기본정보(사건번호·선고일자 등)만으로라도 첨부해준다 — 완전히 막지 않는다.
            callGas('law_get_precedent_detail', { category: category, id: item.id }).then(function(detail){
              doAttach_(wcLawDetailSummary_(category, detail));
            }).catch(function(){
              doAttach_((t.sub || '') + '\n(원문 없음 — 검색결과 기본정보만 첨부됨)');
            });
          });
          resultsBox.appendChild(row);
        });
      }).catch(function(err){ resultsBox.innerHTML = '<div class="log-empty">' + escapeHtml(err && err.message ? err.message : '검색 중 오류가 발생했습니다.') + '</div>'; });
    }
    document.getElementById('wcLawSearchBtn').addEventListener('click', runSearch);
    queryInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); runSearch(); } });
  }

  function renderWorkTree(nodes, container, caseId, depth){
    container.innerHTML = '';
    if (!nodes.length && depth === 0) return;
    nodes.forEach(function(node){
      var row = document.createElement('div');
      row.style.marginLeft = (depth * 20) + 'px';
      row.style.borderLeft = depth ? '2px solid var(--line)' : 'none';
      row.style.padding = '4px 0 4px 8px';
      var overdue = node.dueDate && node.dueDate < new Date().toISOString().slice(0, 10) && node.status !== '완료';
      row.innerHTML =
        '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px;">' +
        '<select class="wcNodeStatus" style="font-size:12px;">' + WORK_SUBTASK_STATUS_OPTIONS.map(function(s){ return '<option value="' + s + '"' + (s === node.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
        '<input type="text" class="wcNodeTitle" value="' + escapeHtml(node.title || '') + '" style="flex:1; min-width:120px; font-size:13px;">' +
        '<input type="text" class="wcNodeAssignee" value="' + escapeHtml(node.assignee || '') + '" placeholder="담당자" style="width:70px; font-size:12px;">' +
        '<input type="date" class="wcNodeDue" value="' + escapeHtml(node.dueDate || '') + '" style="font-size:12px;' + (overdue ? ' color:#a83232;' : '') + '">' +
        '<button type="button" class="ghost-btn wcNodeAddChild" style="padding:3px 8px;">+ 하위</button>' +
        '<span class="log-del wcNodeDelete" title="삭제">✕</span>' +
        '</div>' +
        '<div class="wcChildFormWrap" style="display:none; margin-top:4px; margin-left:20px; gap:6px; flex-wrap:wrap;"></div>' +
        '<div class="wcChildren"></div>';
      container.appendChild(row);

      var statusSel = row.querySelector('.wcNodeStatus');
      var titleInput = row.querySelector('.wcNodeTitle');
      var assigneeInput = row.querySelector('.wcNodeAssignee');
      var dueInput = row.querySelector('.wcNodeDue');

      statusSel.addEventListener('change', function(){ updateWorkSubtask(caseId, node.id, { status: statusSel.value }); });
      titleInput.addEventListener('change', function(){ updateWorkSubtask(caseId, node.id, { title: titleInput.value.trim() }); });
      assigneeInput.addEventListener('change', function(){ updateWorkSubtask(caseId, node.id, { assignee: assigneeInput.value.trim() }); });
      dueInput.addEventListener('change', function(){ updateWorkSubtask(caseId, node.id, { dueDate: dueInput.value }); });

      row.querySelector('.wcNodeDelete').addEventListener('click', function(){
        if (!confirm('"' + (node.title || '') + '" 항목을 삭제할까요?' + (node.children && node.children.length ? ' 하위 항목도 함께 지워집니다.' : ''))) return;
        deleteWorkSubtask(caseId, node.id);
      });

      var addChildBtn = row.querySelector('.wcNodeAddChild');
      var childFormWrap = row.querySelector('.wcChildFormWrap');
      addChildBtn.addEventListener('click', function(){
        if (childFormWrap.style.display === 'none'){
          childFormWrap.style.display = 'flex';
          childFormWrap.innerHTML =
            '<input type="text" class="wcChildTitle" placeholder="세부항목 이름" style="flex:1; min-width:120px; font-size:12.5px;">' +
            '<input type="date" class="wcChildDue" style="font-size:12px;">' +
            '<button type="button" class="save-btn wcChildSave" style="padding:3px 8px;">추가</button>' +
            '<button type="button" class="ghost-btn wcChildCancel" style="padding:3px 8px;">취소</button>';
          childFormWrap.querySelector('.wcChildCancel').addEventListener('click', function(){ childFormWrap.style.display = 'none'; childFormWrap.innerHTML = ''; });
          childFormWrap.querySelector('.wcChildSave').addEventListener('click', function(){
            var t = childFormWrap.querySelector('.wcChildTitle').value.trim();
            if (!t){ showToast('항목 이름을 입력해주세요.', 'warning'); return; }
            addWorkSubtask(caseId, node.id, t, childFormWrap.querySelector('.wcChildDue').value);
          });
        } else {
          childFormWrap.style.display = 'none';
          childFormWrap.innerHTML = '';
        }
      });

      renderWorkTree(node.children || [], row.querySelector('.wcChildren'), caseId, depth + 1);
    });
  }

  function applyUpdatedCase(caseObj){
    var idx = workCases.findIndex(function(c){ return c.id === caseObj.id; });
    if (idx !== -1) workCases[idx] = caseObj; else workCases.push(caseObj);
    workSelectedCaseId = caseObj.id;
    renderWorkCaseList();
    renderWorkCaseDetail(caseObj);
  }

  function addWorkSubtask(caseId, parentId, title, dueDate){
    if (!title){ showToast('항목 이름을 입력해주세요.', 'warning'); return; }
    callGas('work_add_subtask', { id: caseId, parentId: parentId, title: title, dueDate: dueDate }).then(function(res){
      if (res.error || res.success === false){ showToast(res.error || res.message || '추가 실패', 'error'); return; }
      applyUpdatedCase(res.case);
    }).catch(function(){ showToast('추가 중 오류가 발생했습니다.', 'error'); });
  }

  function updateWorkSubtask(caseId, nodeId, fields){
    callGas('work_update_subtask', Object.assign({ id: caseId, nodeId: nodeId }, fields)).then(function(res){
      if (res.error || res.success === false){ showToast(res.error || res.message || '수정 실패', 'error'); return; }
      applyUpdatedCase(res.case);
    }).catch(function(){ showToast('수정 중 오류가 발생했습니다.', 'error'); });
  }

  function deleteWorkSubtask(caseId, nodeId){
    callGas('work_delete_subtask', { id: caseId, nodeId: nodeId }).then(function(res){
      if (res.error || res.success === false){ showToast(res.error || res.message || '삭제 실패', 'error'); return; }
      applyUpdatedCase(res.case);
    }).catch(function(){ showToast('삭제 중 오류가 발생했습니다.', 'error'); });
  }

  document.getElementById('btnWorkCaseNew').addEventListener('click', renderNewCaseForm);
  workCaseFilterStatus.addEventListener('change', renderWorkCaseList);
</script>
