<div class="view" id="view-casehandling">
  <div class="view-head"><h2>🧭 사건처리</h2><p style="color:var(--sub); font-size:12.5px; margin:2px 0 0;">사건 하나를 골라 처리방향·처리대상을 정하고, 작업일지를 남깁니다. 증빙·법령관리·my.netax.kr 연동은 각 카드에서 요약만 보고 실제 작업은 해당 화면에서 합니다.</p></div>
  <div class="view-body">
    <div class="card">
      <label style="display:block; font-size:12px; color:var(--sub); margin-bottom:5px;">처리할 사건</label>
      <select id="chCaseSelect" style="width:100%; max-width:420px;"><option value="">사건을 선택하세요</option></select>
    </div>
    <div id="chBody"><div class="explorer-status">위에서 사건을 선택해주세요.</div></div>
  </div>
</div>

<script>
  // ============================================================
  // 사건처리 — 작업관리(사건 목록·현황)와 분리된 "실제 처리" 전용 화면.
  // [2026.09] 원래 작업관리 사건 상세화면 안에 처리방향/작업일지/법령예규판례를 다 넣었었는데,
  // "작업관리에는 현황만, 실제 작업은 처리에서" 라는 피드백에 따라 이 화면으로 분리했다.
  // 사건 목록은 work_get_cases를 이 화면에서 독립적으로 다시 불러온다(작업관리를 먼저 열지
  // 않고 바로 이 화면으로 와도 동작해야 하므로, workmanage.html의 workCases 전역과는 별도).
  // ============================================================
  var chCases = [];
  var chSelectedId = null;
  var chCaseSelectEl = document.getElementById('chCaseSelect');
  var chBodyEl = document.getElementById('chBody');

  function initCaseHandling(){
    loadChCases_();
  }

  function loadChCases_(preselectId){
    chCaseSelectEl.innerHTML = '<option value="">불러오는 중…</option>';
    callGas('work_get_cases', {}).then(function(res){
      chCases = res.cases || [];
      renderChCaseSelect_();
      var wantId = preselectId || chSelectedId;
      if (wantId && chCases.some(function(c){ return c.id === wantId; })){
        chCaseSelectEl.value = wantId;
        chSelectedId = wantId;
        renderChBody_();
      }
    }).catch(function(){ chCaseSelectEl.innerHTML = '<option value="">불러오지 못했습니다</option>'; });
  }

  function renderChCaseSelect_(){
    var keepValue = chCaseSelectEl.value;
    chCaseSelectEl.innerHTML = '<option value="">사건을 선택하세요</option>' +
      chCases.slice().sort(function(a, b){ return (a.고객명 || '').localeCompare(b.고객명 || ''); }).map(function(c){
        return '<option value="' + c.id + '">' + escapeHtml(c.고객명 || '') + ' · ' + escapeHtml(c.사건명 || '') + ' (' + escapeHtml(c.상태 || '') + ')</option>';
      }).join('');
    if (keepValue) chCaseSelectEl.value = keepValue;
  }

  chCaseSelectEl.addEventListener('change', function(){
    chSelectedId = chCaseSelectEl.value || null;
    renderChBody_();
  });

  function renderChBody_(){
    if (!chSelectedId){
      chBodyEl.innerHTML = '<div class="explorer-status">위에서 사건을 선택해주세요.</div>';
      return;
    }
    var c = chCases.filter(function(x){ return x.id === chSelectedId; })[0];
    if (!c){
      chBodyEl.innerHTML = '<div class="explorer-status">사건을 찾을 수 없습니다.</div>';
      return;
    }
    chBodyEl.innerHTML =
      (c.폴더ID
        ? '<div style="margin-bottom:10px;"><a href="https://drive.google.com/drive/folders/' + encodeURIComponent(c.폴더ID) + '" target="_blank" rel="noopener" class="ghost-btn" style="text-decoration:none; display:inline-block;">📁 이 사건 폴더 열기</a></div>'
        : '') +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📋 사건처리개시 — 처리대상 · 처리방향</div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">처리대상 <span style="font-weight:400;">(무엇을 처리하는지)</span></label>' +
      '<input type="text" id="chEditTarget" placeholder="예: OO아파트 매각건의 양도소득세 신고" value="' + escapeHtml(c.처리대상 || '') + '" style="width:100%; max-width:600px; box-sizing:border-box; margin-bottom:8px;">' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">처리방향 <span style="font-weight:400;">(법령·예규·판례를 검토해 어떻게 처리할지)</span></label>' +
      '<textarea id="chEditDirection" placeholder="예: 1세대1주택 비과세 요건 충족 여부 검토 후 신고" style="width:100%; max-width:600px; min-height:50px; font-family:inherit; font-size:13px; box-sizing:border-box;">' + escapeHtml(c.처리방향 || '') + '</textarea>' +
      '<div style="margin-top:8px;"><button type="button" id="chSaveTarget" class="save-btn">저장</button></div>' +
      '</div>' +
      '<div class="card">' +
      '<div id="chLogToggle" style="font-size:12.5px; color:var(--sub); margin-bottom:8px; cursor:pointer; width:fit-content;" title="눌러서 작업일지 추가">📓 작업일지 ' + (c.작업일지 || []).length + '건</div>' +
      '<div id="chNewLogFormWrap" style="display:none; gap:6px; margin-bottom:10px; flex-wrap:wrap;"></div>' +
      '<div id="chLogList"></div>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">⚖️ 법령관리</div>' +
      '<div style="font-size:13px; color:var(--sub); margin-bottom:10px;">' + ((c.법령예규판례 || []).length ? ('첨부된 자료 ' + (c.법령예규판례 || []).length + '건') : '아직 첨부된 자료가 없습니다.') + '</div>' +
      '<button type="button" id="chLawOpenBtn" class="ghost-btn">⚖️ 법령관리에서 열기</button>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">🧮 세액계산</div>' +
      '<div style="font-size:13px; color:var(--sub); margin-bottom:10px;">' + ((c.세액계산결과 || []).length ? ('저장된 계산 ' + (c.세액계산결과 || []).length + '건') : '아직 저장된 계산이 없습니다.') + '</div>' +
      '<button type="button" id="chTaxCalcOpenBtn" class="ghost-btn">🧮 세액계산 열기</button>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📁 증빙</div>' +
      '<div id="chEvSummary" style="font-size:13px; color:var(--sub); margin-bottom:10px;"></div>' +
      '<button type="button" id="chEvOpenDocsBtn" class="ghost-btn">📁 증빙관리에서 열기</button>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;">🔗 my.netax.kr 고객포털</div>' +
      '<div id="chMyPortalBody">불러오는 중…</div>' +
      '</div>';

    document.getElementById('chSaveTarget').addEventListener('click', function(){
      callGas('work_update_case', {
        id: c.id,
        처리대상: document.getElementById('chEditTarget').value.trim(),
        처리방향: document.getElementById('chEditDirection').value.trim()
      }).then(function(res){
        if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
        showToast('저장했습니다.', 'success');
        loadChCases_();
        if (typeof loadWorkCases === 'function') loadWorkCases();
      }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
    });

    chRenderLog_(c);
    document.getElementById('chLawOpenBtn').addEventListener('click', function(){
      if (typeof goToLawSearch_ === 'function') goToLawSearch_(c.id);
    });
    document.getElementById('chTaxCalcOpenBtn').addEventListener('click', function(){
      if (typeof goToTaxCalc_ === 'function') goToTaxCalc_(c.id);
    });
    chRenderEvidenceSummary_(c);
    chInitMyPortal_(c);
  }

  function chSaveLog_(caseId, newLog){
    callGas('work_update_case', { id: caseId, 작업일지: newLog }).then(function(res){
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
      loadChCases_();
      if (typeof loadWorkCases === 'function') loadWorkCases();
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
  }

  function chRenderLog_(c){
    var list = document.getElementById('chLogList');
    if (!list) return;
    var entries = (c.작업일지 || []).slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
    if (!entries.length){
      list.innerHTML = '<div class="log-empty">아직 작업일지가 없습니다.</div>';
    } else {
      list.innerHTML = '';
      entries.forEach(function(entry){
        var row = document.createElement('div');
        row.className = 'log-entry';
        row.innerHTML =
          '<div class="log-date">' + escapeHtml(fmtDateShort_(entry.date) || entry.date || '') + '</div>' +
          '<div class="log-text">' + escapeHtml(entry.text || '') +
          (entry.dueDate ? ' <span style="color:var(--sub); font-size:12px;">— 다음: ' + escapeHtml(fmtDateShort_(entry.dueDate)) + '</span>' : '') + '</div>' +
          '<span class="log-del" title="삭제">✕</span>';
        row.querySelector('.log-del').addEventListener('click', function(){
          var newLog = (c.작업일지 || []).filter(function(e){ return e.id !== entry.id; });
          chSaveLog_(c.id, newLog);
        });
        list.appendChild(row);
      });
    }

    var newLogFormWrap = document.getElementById('chNewLogFormWrap');
    document.getElementById('chLogToggle').addEventListener('click', function(){
      if (newLogFormWrap.style.display === 'none'){
        newLogFormWrap.style.display = 'flex';
        var todayStr = new Date().toISOString().slice(0, 10);
        newLogFormWrap.innerHTML =
          '<input type="date" id="chNewLogDate" value="' + todayStr + '" style="width:130px;">' +
          '<input type="text" id="chNewLogText" placeholder="진행 내용 · 다음 할일" style="flex:1; min-width:160px;">' +
          '<input type="date" id="chNewLogDue" title="다음 일정(선택) — 입력하면 캘린더에 등록됩니다">' +
          '<button type="button" id="chAddLog" class="save-btn">추가</button>' +
          '<button type="button" id="chAddLogCancel" class="ghost-btn">취소</button>';
        document.getElementById('chAddLogCancel').addEventListener('click', function(){ newLogFormWrap.style.display = 'none'; newLogFormWrap.innerHTML = ''; });
        document.getElementById('chAddLog').addEventListener('click', function(){
          var text = document.getElementById('chNewLogText').value.trim();
          if (!text){ showToast('내용을 입력해주세요.', 'warning'); return; }
          var entry = {
            id: 'log_' + Date.now(),
            date: document.getElementById('chNewLogDate').value || todayStr,
            text: text,
            dueDate: document.getElementById('chNewLogDue').value || ''
          };
          var newLog = (c.작업일지 || []).concat([entry]);
          chSaveLog_(c.id, newLog);
        });
      } else {
        newLogFormWrap.style.display = 'none';
        newLogFormWrap.innerHTML = '';
      }
    });
  }

  // 법령예규판례 검색·첨부 UI는 별도 탭(lawsearch.html)으로 옮겼다 — "사건처리=대시보드,
  // 실제 작업은 각 처리 화면에서"라는 원칙에 맞춰 여기는 요약+이동 버튼만 남긴다.

  // 작업관리 사건 상세화면의 "🧭 이 사건 처리하기" 버튼에서 호출 — 사건처리 화면으로 이동하고
  // 그 사건을 바로 골라준다.
  function goToCaseHandling_(caseId){
    if (typeof goToView_ === 'function') goToView_('casehandling');
    chSelectedId = caseId;
    loadChCases_(caseId);
  }

  // ============================================================
  // 3단계였던 증빙 3분류(자동확보/추가확보/요청자료)의 실제 목록·검색·추가 UI는 증빙관리
  // (docs.html)로 옮겼다 — "사건처리=이 사건의 대시보드, 실제 작업(파일)은 증빙관리"라는
  // 원칙에 맞게, 여기서는 건수 요약과 증빙관리로 바로 이동하는 버튼만 둔다. 다만 저장
  // 함수(chSaveEvidence_/chAddEvidence_)는 my포털 카드의 "요청자료 추가"(chAddRequestedItem_)가
  // 여전히 써서 여기 남겨뒀다.
  // ============================================================
  function chSaveEvidence_(caseId, newList){
    callGas('work_update_case', { id: caseId, 증빙목록: newList }).then(function(res){
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
      loadChCases_();
      if (typeof loadWorkCases === 'function') loadWorkCases();
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
  }

  function chAddEvidence_(c, entryPartial){
    var entry = Object.assign({ id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }, entryPartial);
    var newList = (c.증빙목록 || []).concat([entry]);
    chSaveEvidence_(c.id, newList);
  }

  function chRenderEvidenceSummary_(c){
    var el = document.getElementById('chEvSummary');
    if (!el) return;
    var list = c.증빙목록 || [];
    var auto = list.filter(function(e){ return e.source === 'auto'; }).length;
    var manual = list.filter(function(e){ return e.source === 'manual'; }).length;
    var requested = list.filter(function(e){ return e.source === 'requested'; });
    var reqPending = requested.filter(function(e){ return e.status !== '확보됨'; }).length;
    el.textContent = list.length
      ? ('자동확보 ' + auto + '건 · 추가확보 ' + manual + '건 · 요청자료 ' + requested.length + '건(미확보 ' + reqPending + '건)')
      : '아직 등록된 증빙이 없습니다.';
    document.getElementById('chEvOpenDocsBtn').addEventListener('click', function(){
      // listFolder는 path가 있으면 절대 루트부터 이름을 따라 내려가므로, "고객사건" 기본폴더
      // 까지의 전체 경로(getCustomerRootPath_)를 먼저 구해서 사건명을 그 뒤에 붙여야 한다.
      getCustomerRootPath_().then(function(basePath){
        // [버그수정] 증빙관리를 이번 페이지에서 처음 여는 거면 goToView_('docs')가 내부적으로
        // initDocs()를 불러 자기 나름의 기본 위치(고객사건 폴더 자체)로 또 이동시켜버린다 —
        // 그게 우리가 지금 지정하는 사건 폴더 이동과 동시에 실행되면서 경쟁하다가, 매번
        // "기본 위치"(=사건 폴더 바로 위)가 이겨서 그쪽으로 보였다. docsLoaded를 먼저 true로
        // 표시해 initDocs()의 자체 이동을 막아둔다.
        docsLoaded = true;
        if (typeof goToView_ === 'function') goToView_('docs');
        if (typeof docsNavigate === 'function') docsNavigate(basePath.concat([(c.고객명 + ' ' + c.사건명).trim()]));
      });
    });
  }

  // ============================================================
  // 4단계 — my.netax.kr 고객포털 연동. "요청자료"는 곧 my.netax.kr의 체크리스트 항목과 같은
  // 개념이라(예약의 직권등록과 같은 구조 — 직원이 대신 자료를 올릴 수도, 고객이 my페이지로
  // 들어와 스스로 올릴 수도 있음), 사건에 연결된 my_report_id가 있으면 요청자료를 추가할 때
  // 자동으로 그쪽 체크리스트에도 반영한다(반대 방향은 my포털 카드 자체에서 추가할 때도 동일
  // 함수를 태워 한쪽만 구현하지 않는다).
  // ============================================================
  function chAddRequestedItem_(c, label, note){
    chAddEvidence_(c, { source: 'requested', label: label, note: note || '', status: '미확보', 요청일: new Date().toISOString().slice(0, 10) });
    if (c.my_report_id){
      callGas('admin_add_checklist_item', { report_id: c.my_report_id, item: label }).catch(function(){});
    }
  }

  function chInitMyPortal_(c){
    var box = document.getElementById('chMyPortalBody');
    if (!box) return;

    if (!c.my_report_id){
      box.innerHTML =
        '<div style="font-size:12.5px; color:var(--sub); margin-bottom:8px;">아직 고객포털에 연결되지 않았습니다. 연결하면 위 "요청자료"가 고객 체크리스트로 자동 전달되고, 고객이 my.netax.kr로 들어와 직접 자료를 올리고 진행상황·결과보고서를 확인할 수 있습니다.</div>' +
        '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:8px;">보고서 다운로드 권한 ' +
        '<select id="chMyNewPermission" style="margin-left:4px;"><option value="허용">허용(다운로드 가능)</option><option value="차단">차단(다운로드 불가)</option></select></label>' +
        '<button type="button" id="chMyConnectBtn" class="save-btn">🔗 고객포털 연결하기</button>';
      document.getElementById('chMyConnectBtn').addEventListener('click', function(){
        if (!confirm(c.고객명 + '님을 위한 my.netax.kr 고객포털을 새로 만들까요?')) return;
        var requestedLabels = (c.증빙목록 || []).filter(function(e){ return e.source === 'requested'; }).map(function(e){ return e.label; });
        var permission = document.getElementById('chMyNewPermission').value;
        // 사건 시작 때 이미 만들어둔 폴더(c.폴더ID)를 그대로 넘겨서 my.netax.kr이 별도 폴더를
        // 새로 만들지 않고 재사용하게 한다 — 그래야 고객 업로드가 증빙관리와 같은 폴더에 쌓인다.
        callGas('admin_create_case', { name: c.고객명, case_name: c.사건명, checklist: requestedLabels, permission: permission, folder_id: c.폴더ID || '' }).then(function(res){
          if (res.success === false){ showToast(res.message || '연결 실패', 'error'); return; }
          callGas('work_update_case', { id: c.id, my_report_id: res.report_id }).then(function(){
            showToast('고객포털을 연결했습니다 — 열람번호 ' + res.report_id, 'success');
            loadChCases_();
            if (typeof loadWorkCases === 'function') loadWorkCases();
          });
        }).catch(function(err){ showToast('연결 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
      });
      return;
    }

    box.innerHTML = '<div class="log-empty">불러오는 중…</div>';
    callGas('admin_get_case', { report_id: c.my_report_id }).then(function(res){
      if (res.success === false){
        box.innerHTML = '<div class="log-empty">' + escapeHtml(res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      var mc = res.case;
      var url = 'https://my.netax.kr/?report_id=' + mc.report_id;
      var checklist = mc.checklist || [];
      var status = mc.submission_status || {};
      var rows = checklist.map(function(item){
        var done = status[item] && status[item].submitted;
        return '<div class="log-entry"><div class="log-date" style="color:' + (done ? 'var(--navy)' : 'var(--sub)') + ';">' + (done ? '제출완료' : '미제출') + '</div>' +
          '<div class="log-text">' + escapeHtml(item) + '</div></div>';
      }).join('');
      var extra = status._extra || [];
      box.innerHTML =
        '<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">' +
        '<code style="background:var(--panel); padding:3px 8px; border-radius:6px;">' + escapeHtml(mc.report_id) + '</code>' +
        '<button type="button" id="chMyCopyLinkBtn" class="ghost-btn" style="font-size:12px;">🔗 링크복사</button>' +
        '<button type="button" id="chMySendSmsBtn" class="ghost-btn" style="font-size:12px;">📱 문자로 전달</button>' +
        (mc.has_password ? '' : '<span style="font-size:11px; color:var(--danger); border:1px solid var(--danger); border-radius:10px; padding:1px 7px;">비밀번호 미설정</span>') +
        '</div>' +
        '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">체크리스트 제출현황</div>' +
        (rows || '<div class="log-empty">체크리스트가 없습니다.</div>') +
        (extra.length ? '<div style="font-size:12px; color:var(--sub); margin-top:8px;">기타 제출 ' + extra.length + '건: ' + escapeHtml(extra.map(function(f){ return f.fileName; }).join(', ')) + '</div>' : '') +
        '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;">' +
        '<input type="text" id="chMyNewItem" placeholder="추가로 요청할 자료명" style="flex:1; min-width:140px;">' +
        '<button type="button" id="chMyAddItemBtn" class="save-btn">추가</button>' +
        '</div>' +
        '<div style="margin-top:16px; padding-top:12px; border-top:1px dashed var(--line);">' +
        '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">보고서 열람 <span style="font-weight:400;">(고객이 my.netax.kr에서 이 폴더의 .html 파일을 봅니다)</span></div>' +
        '<div id="chMyReports"><div class="log-empty">불러오는 중…</div></div>' +
        '</div>';
      chLoadMyReports_(c);

      document.getElementById('chMyCopyLinkBtn').addEventListener('click', function(){
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){ showToast('링크를 복사했습니다.', 'success'); });
        else showToast(url, 'success');
      });
      document.getElementById('chMySendSmsBtn').addEventListener('click', function(){
        if (!confirm(c.고객명 + '님께 my.netax.kr 주소와 접근번호를 문자로 보낼까요?')) return;
        var btn = document.getElementById('chMySendSmsBtn');
        btn.disabled = true; btn.textContent = '전송 중…';
        callGas('send_my_portal_sms', { caseId: c.id }).then(function(res){
          btn.disabled = false; btn.textContent = '📱 문자로 전달';
          if (res.success === false){ showToast(res.message || '전송 실패', 'error'); return; }
          showToast('문자를 전송했습니다.', 'success');
        }).catch(function(err){ btn.disabled = false; btn.textContent = '📱 문자로 전달'; showToast('전송 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
      });
      document.getElementById('chMyAddItemBtn').addEventListener('click', function(){
        var label = document.getElementById('chMyNewItem').value.trim();
        if (!label){ showToast('자료명을 입력해주세요.', 'warning'); return; }
        chAddRequestedItem_(c, label, '');
      });
    }).catch(function(err){ box.innerHTML = '<div class="log-empty">불러오는 중 오류: ' + escapeHtml(err && err.message ? err.message : '') + '</div>'; });
  }

  // my.netax.kr 케이스 폴더 안 "보고서" 하위폴더(5-A에서 사건 폴더와 통합됨) 안의 파일 목록을
  // 보여준다 — 여기 .html 파일을 넣어두면 고객이 my.netax.kr에서 바로 본다(my_handleGetReportList
  // 가 .html/.htm만 필터링해서 보여줌). listFolder는 이미 있는 범용 Drive 탐색 액션을 그대로 씀.
  function chLoadMyReports_(c){
    var box = document.getElementById('chMyReports');
    if (!box) return;
    var folderName = (c.고객명 + ' ' + c.사건명).trim();
    // listFolder는 path가 있으면 절대 루트부터 이름을 따라 내려가므로 "고객사건" 기본폴더까지의
    // 전체 경로가 필요하다(위 "증빙관리에서 열기"와 같은 이유).
    getCustomerRootPath_().then(function(basePath){
    return callGas('listFolder', { path: basePath.concat([folderName, '보고서']) }).then(function(res){
      if (res.error){ box.innerHTML = '<div class="log-empty">' + escapeHtml(res.error) + '</div>'; return; }
      var files = res.files || [];
      var openLink = '<a href="https://drive.google.com/drive/folders/' + encodeURIComponent(res.folderId) + '" target="_blank" rel="noopener" class="ghost-btn" style="text-decoration:none; display:inline-block; font-size:12px; margin-bottom:8px;">📁 보고서 폴더 열기</a>';
      // [2026.09] 작성관리(report-writer)가 work.netax.kr을 새 창으로 여는 링크가 아니라 이 앱
      // 안의 네이티브 화면(reportwriter.html)으로 이식됐으므로, <a href> 대신 버튼 + goToReportWriter_
      // 호출로 바꿨다. saveFolderId(이 폴더 ID)를 넘기면 작성관리가 처음 저장할 때 이 폴더 안에
      // 파일을 새로 만들고, 그 다음부터는 그 파일을 덮어쓰기 저장한다.
      var newDocLink = '<button type="button" id="chNewReportBtn" class="ghost-btn" style="font-size:12px; margin-bottom:8px; margin-left:6px;">✍ 새 문서 작성</button>';
      if (!files.length){
        box.innerHTML = openLink + newDocLink + '<div class="log-empty">아직 올린 보고서가 없습니다. 위 폴더에 .html 파일을 넣으면 고객이 my.netax.kr에서 봅니다.</div>';
      } else {
        var htmlFiles = files.filter(function(f){ return /\.html?$/i.test(f.name); });
        var otherFiles = files.filter(function(f){ return !/\.html?$/i.test(f.name); });
        var rows = htmlFiles.map(function(f){
          return '<div class="log-entry"><div class="log-date" style="color:var(--navy);">열람가능</div><div class="log-text">' + escapeHtml(f.name) +
            ' <button type="button" class="chEditReportBtn ghost-btn" data-file-id="' + escapeHtml(f.id) + '" style="font-size:11px; padding:1px 7px; margin-left:6px;">✍ 편집</button>' +
            '</div></div>';
        }).join('');
        box.innerHTML = openLink + newDocLink + rows +
          (otherFiles.length ? '<div style="font-size:12px; color:var(--sub); margin-top:6px;">그 외 파일(.html 아님, 고객에게 안 보임) ' + otherFiles.length + '건: ' + escapeHtml(otherFiles.map(function(f){ return f.name; }).join(', ')) + '</div>' : '');
      }
      var newBtn = document.getElementById('chNewReportBtn');
      if (newBtn){
        newBtn.addEventListener('click', function(){
          if (typeof goToReportWriter_ === 'function') goToReportWriter_(c.id, { saveFolderId: res.folderId, saveFileName: folderName });
        });
      }
      box.querySelectorAll('.chEditReportBtn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (typeof goToReportWriter_ === 'function') goToReportWriter_(c.id, { fileId: btn.getAttribute('data-file-id') });
        });
      });
    });
    }).catch(function(){ box.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>'; });
  }
</script>
