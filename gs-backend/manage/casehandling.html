<div class="view" id="view-casehandling">
  <div class="view-head"><h2>🧭 사건처리</h2><p style="color:var(--sub); font-size:12.5px; margin:2px 0 0;">사건 하나를 골라 처리방향·처리대상을 정하고, 작업일지를 남기고, 법령예규판례를 찾아 첨부합니다. (작업관리는 목록·현황 확인용, 실제 처리는 여기서 합니다.)</p></div>
  <div class="view-body">
    <div class="card">
      <label style="display:block; font-size:12px; color:var(--sub); margin-bottom:5px;">처리할 사건</label>
      <select id="chCaseSelect" style="width:100%; max-width:420px;"><option value="">사건을 선택하세요</option></select>
    </div>
    <div id="chBody"><div class="explorer-status">위에서 사건을 선택해주세요.</div></div>
  </div>
</div>

<script>
  // ============================================================
  // 사건처리 — 작업관리(사건 목록·현황)와 분리된 "실제 처리" 전용 화면.
  // [2026.09] 원래 작업관리 사건 상세화면 안에 처리방향/작업일지/법령예규판례를 다 넣었었는데,
  // "작업관리에는 현황만, 실제 작업은 처리에서" 라는 피드백에 따라 이 화면으로 분리했다.
  // 사건 목록은 work_get_cases를 이 화면에서 독립적으로 다시 불러온다(작업관리를 먼저 열지
  // 않고 바로 이 화면으로 와도 동작해야 하므로, workmanage.html의 workCases 전역과는 별도).
  // ============================================================
  var chCases = [];
  var chSelectedId = null;
  var chCaseSelectEl = document.getElementById('chCaseSelect');
  var chBodyEl = document.getElementById('chBody');

  function initCaseHandling(){
    loadChCases_();
  }

  function loadChCases_(preselectId){
    chCaseSelectEl.innerHTML = '<option value="">불러오는 중…</option>';
    callGas('work_get_cases', {}).then(function(res){
      chCases = res.cases || [];
      renderChCaseSelect_();
      var wantId = preselectId || chSelectedId;
      if (wantId && chCases.some(function(c){ return c.id === wantId; })){
        chCaseSelectEl.value = wantId;
        chSelectedId = wantId;
        renderChBody_();
      }
    }).catch(function(){ chCaseSelectEl.innerHTML = '<option value="">불러오지 못했습니다</option>'; });
  }

  function renderChCaseSelect_(){
    var keepValue = chCaseSelectEl.value;
    chCaseSelectEl.innerHTML = '<option value="">사건을 선택하세요</option>' +
      chCases.slice().sort(function(a, b){ return (a.고객명 || '').localeCompare(b.고객명 || ''); }).map(function(c){
        return '<option value="' + c.id + '">' + escapeHtml(c.고객명 || '') + ' · ' + escapeHtml(c.사건명 || '') + ' (' + escapeHtml(c.상태 || '') + ')</option>';
      }).join('');
    if (keepValue) chCaseSelectEl.value = keepValue;
  }

  chCaseSelectEl.addEventListener('change', function(){
    chSelectedId = chCaseSelectEl.value || null;
    renderChBody_();
  });

  function renderChBody_(){
    if (!chSelectedId){
      chBodyEl.innerHTML = '<div class="explorer-status">위에서 사건을 선택해주세요.</div>';
      return;
    }
    var c = chCases.filter(function(x){ return x.id === chSelectedId; })[0];
    if (!c){
      chBodyEl.innerHTML = '<div class="explorer-status">사건을 찾을 수 없습니다.</div>';
      return;
    }
    chBodyEl.innerHTML =
      (c.폴더ID
        ? '<div style="margin-bottom:10px;"><a href="https://drive.google.com/drive/folders/' + encodeURIComponent(c.폴더ID) + '" target="_blank" rel="noopener" class="ghost-btn" style="text-decoration:none; display:inline-block;">📁 이 사건 폴더 열기</a></div>'
        : '') +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">📋 사건처리개시 — 처리대상 · 처리방향</div>' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">처리대상 <span style="font-weight:400;">(무엇을 처리하는지)</span></label>' +
      '<input type="text" id="chEditTarget" placeholder="예: OO아파트 매각건의 양도소득세 신고" value="' + escapeHtml(c.처리대상 || '') + '" style="width:100%; max-width:600px; box-sizing:border-box; margin-bottom:8px;">' +
      '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:3px;">처리방향 <span style="font-weight:400;">(법령·예규·판례를 검토해 어떻게 처리할지)</span></label>' +
      '<textarea id="chEditDirection" placeholder="예: 1세대1주택 비과세 요건 충족 여부 검토 후 신고" style="width:100%; max-width:600px; min-height:50px; font-family:inherit; font-size:13px; box-sizing:border-box;">' + escapeHtml(c.처리방향 || '') + '</textarea>' +
      '<div style="margin-top:8px;"><button type="button" id="chSaveTarget" class="save-btn">저장</button></div>' +
      '</div>' +
      '<div class="card">' +
      '<div id="chLogToggle" style="font-size:12.5px; color:var(--sub); margin-bottom:8px; cursor:pointer; width:fit-content;" title="눌러서 작업일지 추가">📓 작업일지 ' + (c.작업일지 || []).length + '건</div>' +
      '<div id="chNewLogFormWrap" style="display:none; gap:6px; margin-bottom:10px; flex-wrap:wrap;"></div>' +
      '<div id="chLogList"></div>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:8px;">⚖️ 법령예규판례</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<select id="chLawCategory" style="width:120px;"><option value="precedent">판례</option><option value="interpretation">법령해석례</option><option value="administrative_rule">행정규칙</option></select>' +
      '<input type="text" id="chLawQuery" placeholder="검색어 (예: 1세대1주택 비과세)" style="flex:1; min-width:160px;">' +
      '<button type="button" id="chLawSearchBtn" class="ghost-btn">검색</button>' +
      '</div>' +
      '<div id="chLawResults"></div>' +
      '<div style="margin-top:12px;">' +
      '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">이 사건에 첨부된 자료</div>' +
      '<div id="chLawAttached"></div>' +
      '</div>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;">📁 증빙</div>' +
      '<div style="margin-bottom:18px;">' +
      '<div style="font-size:12px; font-weight:600; color:var(--sub); margin-bottom:6px;">자동확보</div>' +
      '<button type="button" id="chEvAutoAddrBtn" class="ghost-btn" style="margin-bottom:8px;">🏠 주소로 자동조회(실거래가·공시가격)</button>' +
      '<div id="chEvAutoPicked"></div>' +
      '<div id="chEvListAuto"></div>' +
      '</div>' +
      '<div style="margin-bottom:18px;">' +
      '<div style="font-size:12px; font-weight:600; color:var(--sub); margin-bottom:6px;">추가확보</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<input type="text" id="chEvManualLabel" placeholder="자료명 (예: 등기부등본)" style="flex:1; min-width:140px;">' +
      '<input type="text" id="chEvManualNote" placeholder="메모·링크(선택)" style="flex:1; min-width:140px;">' +
      '<button type="button" id="chEvManualAddBtn" class="save-btn">추가</button>' +
      '</div>' +
      '<div id="chEvListManual"></div>' +
      '</div>' +
      '<div>' +
      '<div style="font-size:12px; font-weight:600; color:var(--sub); margin-bottom:6px;">요청자료 <span style="font-weight:400;">(고객에게 요청)</span></div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
      '<input type="text" id="chEvReqLabel" placeholder="요청할 자료명 (예: 매매계약서)" style="flex:1; min-width:140px;">' +
      '<input type="text" id="chEvReqNote" placeholder="메모(선택)" style="flex:1; min-width:140px;">' +
      '<button type="button" id="chEvReqAddBtn" class="save-btn">추가</button>' +
      '</div>' +
      '<div id="chEvListRequested"></div>' +
      '</div>' +
      '</div>' +
      '<div class="card">' +
      '<div style="font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;">🔗 my.netax.kr 고객포털</div>' +
      '<div id="chMyPortalBody">불러오는 중…</div>' +
      '</div>';

    document.getElementById('chSaveTarget').addEventListener('click', function(){
      callGas('work_update_case', {
        id: c.id,
        처리대상: document.getElementById('chEditTarget').value.trim(),
        처리방향: document.getElementById('chEditDirection').value.trim()
      }).then(function(res){
        if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
        showToast('저장했습니다.', 'success');
        loadChCases_();
        if (typeof loadWorkCases === 'function') loadWorkCases();
      }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
    });

    chRenderLog_(c);
    chInitLawSection_(c);
    chInitEvidenceSection_(c);
    chInitMyPortal_(c);
  }

  function chSaveLog_(caseId, newLog){
    callGas('work_update_case', { id: caseId, 작업일지: newLog }).then(function(res){
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
      loadChCases_();
      if (typeof loadWorkCases === 'function') loadWorkCases();
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
  }

  function chRenderLog_(c){
    var list = document.getElementById('chLogList');
    if (!list) return;
    var entries = (c.작업일지 || []).slice().sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
    if (!entries.length){
      list.innerHTML = '<div class="log-empty">아직 작업일지가 없습니다.</div>';
    } else {
      list.innerHTML = '';
      entries.forEach(function(entry){
        var row = document.createElement('div');
        row.className = 'log-entry';
        row.innerHTML =
          '<div class="log-date">' + escapeHtml(fmtDateShort_(entry.date) || entry.date || '') + '</div>' +
          '<div class="log-text">' + escapeHtml(entry.text || '') +
          (entry.dueDate ? ' <span style="color:var(--sub); font-size:12px;">— 다음: ' + escapeHtml(fmtDateShort_(entry.dueDate)) + '</span>' : '') + '</div>' +
          '<span class="log-del" title="삭제">✕</span>';
        row.querySelector('.log-del').addEventListener('click', function(){
          var newLog = (c.작업일지 || []).filter(function(e){ return e.id !== entry.id; });
          chSaveLog_(c.id, newLog);
        });
        list.appendChild(row);
      });
    }

    var newLogFormWrap = document.getElementById('chNewLogFormWrap');
    document.getElementById('chLogToggle').addEventListener('click', function(){
      if (newLogFormWrap.style.display === 'none'){
        newLogFormWrap.style.display = 'flex';
        var todayStr = new Date().toISOString().slice(0, 10);
        newLogFormWrap.innerHTML =
          '<input type="date" id="chNewLogDate" value="' + todayStr + '" style="width:130px;">' +
          '<input type="text" id="chNewLogText" placeholder="진행 내용 · 다음 할일" style="flex:1; min-width:160px;">' +
          '<input type="date" id="chNewLogDue" title="다음 일정(선택) — 입력하면 캘린더에 등록됩니다">' +
          '<button type="button" id="chAddLog" class="save-btn">추가</button>' +
          '<button type="button" id="chAddLogCancel" class="ghost-btn">취소</button>';
        document.getElementById('chAddLogCancel').addEventListener('click', function(){ newLogFormWrap.style.display = 'none'; newLogFormWrap.innerHTML = ''; });
        document.getElementById('chAddLog').addEventListener('click', function(){
          var text = document.getElementById('chNewLogText').value.trim();
          if (!text){ showToast('내용을 입력해주세요.', 'warning'); return; }
          var entry = {
            id: 'log_' + Date.now(),
            date: document.getElementById('chNewLogDate').value || todayStr,
            text: text,
            dueDate: document.getElementById('chNewLogDue').value || ''
          };
          var newLog = (c.작업일지 || []).concat([entry]);
          chSaveLog_(c.id, newLog);
        });
      } else {
        newLogFormWrap.style.display = 'none';
        newLogFormWrap.innerHTML = '';
      }
    });
  }

  var CH_LAW_CATEGORY_LABELS_ = { precedent: '판례', interpretation: '법령해석례', administrative_rule: '행정규칙' };

  function chLawResultTitle_(category, item){
    if (category === 'precedent') return { title: item.사건명 || '(제목 없음)', sub: [item.사건번호, item.선고일자, item.법원명].filter(Boolean).join(' · ') };
    if (category === 'interpretation') return { title: item.안건명 || '(제목 없음)', sub: [item.안건번호, item.회신일자, item.질의기관].filter(Boolean).join(' · ') };
    return { title: item.행정규칙명 || '(제목 없음)', sub: [item.행정규칙종류, item.발령일자, item.소관부처].filter(Boolean).join(' · ') };
  }

  function chLawDetailSummary_(category, detail){
    var text = category === 'precedent' ? (detail.판결요지 || detail.판시사항 || '')
      : category === 'interpretation' ? (detail.회답 || detail.질의요지 || '')
      : (detail.내용 || '');
    text = String(text).trim();
    return text.length > 300 ? text.slice(0, 300) + '…' : text;
  }

  function chSavePrecedents_(caseId, newList){
    return callGas('work_update_case', { id: caseId, 법령예규판례: newList }).then(function(res){
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return null; }
      loadChCases_();
      if (typeof loadWorkCases === 'function') loadWorkCases();
      return res;
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); return null; });
  }

  function chRenderAttachedPrecedents_(c){
    var wrap = document.getElementById('chLawAttached');
    if (!wrap) return;
    var list = c.법령예규판례 || [];
    if (!list.length){
      wrap.innerHTML = '<div class="log-empty">아직 첨부된 자료가 없습니다.</div>';
      return;
    }
    wrap.innerHTML = '';
    list.slice().reverse().forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.innerHTML =
        '<div class="log-date">' + escapeHtml(CH_LAW_CATEGORY_LABELS_[entry.category] || entry.category) + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.제목 || '') + '</b>' +
        (entry.요약 ? '<br><span style="color:var(--sub); font-size:12.5px;">' + escapeHtml(entry.요약) + '</span>' : '') + '</div>' +
        '<span class="log-del" title="첨부 해제">✕</span>';
      row.querySelector('.log-del').addEventListener('click', function(){
        var newList = list.filter(function(e){ return !(e.category === entry.category && e.id === entry.id); });
        chSavePrecedents_(c.id, newList);
      });
      wrap.appendChild(row);
    });
  }

  function chInitLawSection_(c){
    chRenderAttachedPrecedents_(c);
    var resultsBox = document.getElementById('chLawResults');
    var categorySel = document.getElementById('chLawCategory');
    var queryInput = document.getElementById('chLawQuery');

    function runSearch(){
      var query = queryInput.value.trim();
      if (!query){ showToast('검색어를 입력해주세요.', 'warning'); return; }
      var category = categorySel.value;
      resultsBox.innerHTML = '<div class="log-empty">검색 중…</div>';
      callGas('law_search_precedent', { category: category, query: query }).then(function(res){
        var items = res.results || [];
        if (!items.length){ resultsBox.innerHTML = '<div class="log-empty">' + escapeHtml(res.message || '검색 결과가 없습니다.') + '</div>'; return; }
        resultsBox.innerHTML = '';
        items.forEach(function(item){
          var t = chLawResultTitle_(category, item);
          var row = document.createElement('div');
          row.className = 'log-entry';
          row.innerHTML =
            '<div class="log-text" style="flex:1;"><b>' + escapeHtml(t.title) + '</b>' +
            (t.sub ? '<br><span style="color:var(--sub); font-size:12px;">' + escapeHtml(t.sub) + '</span>' : '') + '</div>' +
            '<button type="button" class="ghost-btn chLawAttachBtn" style="padding:3px 8px; font-size:12px;">➕ 첨부</button>';
          row.querySelector('.chLawAttachBtn').addEventListener('click', function(){
            var attachBtn = row.querySelector('.chLawAttachBtn');
            attachBtn.disabled = true;
            attachBtn.textContent = '조회 중…';
            function doAttach_(요약){
              var entry = { category: category, id: item.id, 제목: t.title, 요약: 요약, 첨부일: new Date().toISOString().slice(0, 10) };
              var already = (c.법령예규판례 || []).some(function(e){ return e.category === entry.category && e.id === entry.id; });
              if (already){ showToast('이미 첨부된 자료입니다.', 'warning'); attachBtn.disabled = false; attachBtn.textContent = '➕ 첨부'; return; }
              var newList = (c.법령예규판례 || []).concat([entry]);
              chSavePrecedents_(c.id, newList);
            }
            callGas('law_get_precedent_detail', { category: category, id: item.id }).then(function(detail){
              doAttach_(chLawDetailSummary_(category, detail));
            }).catch(function(){
              doAttach_((t.sub || '') + '\n(원문 없음 — 검색결과 기본정보만 첨부됨)');
            });
          });
          resultsBox.appendChild(row);
        });
      }).catch(function(err){ resultsBox.innerHTML = '<div class="log-empty">' + escapeHtml(err && err.message ? err.message : '검색 중 오류가 발생했습니다.') + '</div>'; });
    }
    document.getElementById('chLawSearchBtn').addEventListener('click', runSearch);
    queryInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); runSearch(); } });
  }

  // 작업관리 사건 상세화면의 "🧭 이 사건 처리하기" 버튼에서 호출 — 사건처리 화면으로 이동하고
  // 그 사건을 바로 골라준다.
  function goToCaseHandling_(caseId){
    if (typeof goToView_ === 'function') goToView_('casehandling');
    chSelectedId = caseId;
    loadChCases_(caseId);
  }

  // ============================================================
  // 3단계 — 증빙 3분류(자동확보/추가확보/요청자료). 자동확보는 세액계산 화면이 이미 쓰고 있는
  // 주소검색(openAddressSearchModal_)·실거래가(openRealPriceModal_) 모달과 searchAddress/
  // lookupRealPrice/lookupOfficialPrice 액션을 그대로 재사용한다(같은 화면 안에서 전역으로
  // 공유되므로 새로 만들지 않음). 추가확보·요청자료는 수동 입력 + 확보상태 토글.
  // ============================================================
  function chSaveEvidence_(caseId, newList){
    callGas('work_update_case', { id: caseId, 증빙목록: newList }).then(function(res){
      if (res.success === false){ showToast(res.message || '저장 실패', 'error'); return; }
      loadChCases_();
      if (typeof loadWorkCases === 'function') loadWorkCases();
    }).catch(function(err){ showToast('저장 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
  }

  function chAddEvidence_(c, entryPartial){
    var entry = Object.assign({ id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }, entryPartial);
    var newList = (c.증빙목록 || []).concat([entry]);
    chSaveEvidence_(c.id, newList);
  }

  function chRenderEvidenceList_(c, source, containerId){
    var box = document.getElementById(containerId);
    if (!box) return;
    var entries = (c.증빙목록 || []).filter(function(e){ return e.source === source; });
    if (!entries.length){
      box.innerHTML = '<div class="log-empty">없습니다.</div>';
      return;
    }
    box.innerHTML = '';
    entries.forEach(function(entry){
      var row = document.createElement('div');
      row.className = 'log-entry';
      var got = entry.status === '확보됨';
      row.innerHTML =
        '<div class="log-date" style="color:' + (got ? 'var(--navy)' : 'var(--sub)') + ';">' + escapeHtml(entry.status || '') + '</div>' +
        '<div class="log-text"><b>' + escapeHtml(entry.label || '') + '</b>' +
        (entry.note ? '<br><span style="color:var(--sub); font-size:12.5px;">' + escapeHtml(entry.note) + '</span>' : '') + '</div>' +
        (source !== 'auto' ? '<button type="button" class="ghost-btn chEvToggleBtn" style="padding:3px 8px; font-size:12px;">' + (got ? '미확보로' : '확보완료') + '</button>' : '') +
        '<span class="log-del" title="삭제">✕</span>';
      if (source !== 'auto'){
        row.querySelector('.chEvToggleBtn').addEventListener('click', function(){
          var newList = (c.증빙목록 || []).map(function(e){
            if (e.id !== entry.id) return e;
            var nowGot = e.status !== '확보됨';
            return Object.assign({}, e, { status: nowGot ? '확보됨' : '미확보', 확보일: nowGot ? new Date().toISOString().slice(0, 10) : e.확보일 });
          });
          chSaveEvidence_(c.id, newList);
        });
      }
      row.querySelector('.log-del').addEventListener('click', function(){
        var newList = (c.증빙목록 || []).filter(function(e){ return e.id !== entry.id; });
        chSaveEvidence_(c.id, newList);
      });
      box.appendChild(row);
    });
  }

  function chRenderEvAutoPicked_(c, picked){
    var box = document.getElementById('chEvAutoPicked');
    if (!box) return;
    var lawdCd = (picked.admCd || '').slice(0, 5);
    box.innerHTML =
      '<div style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px;">' +
      '<div style="font-size:12.5px; margin-bottom:6px;"><b>' + escapeHtml(picked.roadAddr || picked.jibunAddr || '') + '</b></div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px;">' +
      '<button type="button" id="chEvRealPriceBtn" class="ghost-btn" style="font-size:12px;">실거래가 조회(참고)</button>' +
      '</div>' +
      '<div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">' +
      '<select id="chEvPriceKind" style="width:140px;"><option value="land">개별공시지가(토지)</option><option value="apartment">공동주택가격</option><option value="house">개별주택가격</option></select>' +
      '<input type="text" id="chEvDong" placeholder="동(선택)" style="width:70px;">' +
      '<input type="text" id="chEvHo" placeholder="호" style="width:70px;">' +
      '<button type="button" id="chEvPriceBtn" class="ghost-btn" style="font-size:12px;">공시가격 조회</button>' +
      '</div>' +
      '</div>';

    document.getElementById('chEvRealPriceBtn').addEventListener('click', function(){
      if (!lawdCd){ showToast('이 주소는 법정동코드를 확인할 수 없습니다.', 'error'); return; }
      if (typeof openRealPriceModal_ !== 'function'){ showToast('실거래가 조회 기능을 불러오지 못했습니다.', 'error'); return; }
      openRealPriceModal_(lawdCd, function(item){
        chAddEvidence_(c, {
          source: 'auto',
          label: '실거래가: ' + (item.aptNm || '') + ' ' + (item.dong || '') + ' ' + (item.jibun || ''),
          note: (item.area || '') + '㎡ · ' + (item.floor || '') + '층 · ' + (item.dealDate || '') + ' · ' + Number(item.dealAmount || 0).toLocaleString() + '원',
          status: '확보됨', 확보일: new Date().toISOString().slice(0, 10)
        });
      });
    });

    document.getElementById('chEvPriceBtn').addEventListener('click', function(){
      var priceKind = document.getElementById('chEvPriceKind').value;
      var dong = document.getElementById('chEvDong').value.trim();
      var ho = document.getElementById('chEvHo').value.trim();
      if (!picked.admCd || !picked.lnbrMnnm){ showToast('이 주소는 지번 정보가 부족해 공시가격을 조회할 수 없습니다.', 'error'); return; }
      var san = String(picked.mtYn) === '1' ? '2' : '1';
      var mnnm = ('0000' + picked.lnbrMnnm).slice(-4);
      var slno = ('0000' + (picked.lnbrSlno || '0')).slice(-4);
      var pnu = picked.admCd + san + mnnm + slno;
      callGas('lookupOfficialPrice', { pnu: pnu, priceKind: priceKind, dong: dong, ho: ho }).then(function(data){
        if (data.error){ showToast(data.error, 'error'); return; }
        var kindLabel = priceKind === 'apartment' ? '공동주택가격' : priceKind === 'house' ? '개별주택가격' : '개별공시지가';
        chAddEvidence_(c, {
          source: 'auto',
          label: kindLabel + ': ' + Number(data.price).toLocaleString() + '원',
          note: (picked.roadAddr || picked.jibunAddr || '') + (dong ? ' ' + dong + '동' : '') + (ho ? ' ' + ho + '호' : '') + ' (기준연도 ' + data.stdrYear + ')',
          status: '확보됨', 확보일: new Date().toISOString().slice(0, 10)
        });
      }).catch(function(err){ showToast('조회 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
    });
  }

  function chInitEvidenceSection_(c){
    chRenderEvidenceList_(c, 'auto', 'chEvListAuto');
    chRenderEvidenceList_(c, 'manual', 'chEvListManual');
    chRenderEvidenceList_(c, 'requested', 'chEvListRequested');

    document.getElementById('chEvAutoAddrBtn').addEventListener('click', function(){
      if (typeof openAddressSearchModal_ !== 'function'){ showToast('주소검색 기능을 불러오지 못했습니다.', 'error'); return; }
      openAddressSearchModal_(function(picked){ chRenderEvAutoPicked_(c, picked); });
    });

    document.getElementById('chEvManualAddBtn').addEventListener('click', function(){
      var label = document.getElementById('chEvManualLabel').value.trim();
      if (!label){ showToast('자료명을 입력해주세요.', 'warning'); return; }
      var note = document.getElementById('chEvManualNote').value.trim();
      chAddEvidence_(c, { source: 'manual', label: label, note: note, status: '확보됨', 확보일: new Date().toISOString().slice(0, 10) });
    });

    document.getElementById('chEvReqAddBtn').addEventListener('click', function(){
      var label = document.getElementById('chEvReqLabel').value.trim();
      if (!label){ showToast('요청할 자료명을 입력해주세요.', 'warning'); return; }
      var note = document.getElementById('chEvReqNote').value.trim();
      chAddRequestedItem_(c, label, note);
    });
  }

  // ============================================================
  // 4단계 — my.netax.kr 고객포털 연동. "요청자료"는 곧 my.netax.kr의 체크리스트 항목과 같은
  // 개념이라(예약의 직권등록과 같은 구조 — 직원이 대신 자료를 올릴 수도, 고객이 my페이지로
  // 들어와 스스로 올릴 수도 있음), 사건에 연결된 my_report_id가 있으면 요청자료를 추가할 때
  // 자동으로 그쪽 체크리스트에도 반영한다(반대 방향은 my포털 카드 자체에서 추가할 때도 동일
  // 함수를 태워 한쪽만 구현하지 않는다).
  // ============================================================
  function chAddRequestedItem_(c, label, note){
    chAddEvidence_(c, { source: 'requested', label: label, note: note || '', status: '미확보', 요청일: new Date().toISOString().slice(0, 10) });
    if (c.my_report_id){
      callGas('admin_add_checklist_item', { report_id: c.my_report_id, item: label }).catch(function(){});
    }
  }

  function chInitMyPortal_(c){
    var box = document.getElementById('chMyPortalBody');
    if (!box) return;

    if (!c.my_report_id){
      box.innerHTML =
        '<div style="font-size:12.5px; color:var(--sub); margin-bottom:8px;">아직 고객포털에 연결되지 않았습니다. 연결하면 위 "요청자료"가 고객 체크리스트로 자동 전달되고, 고객이 my.netax.kr로 들어와 직접 자료를 올리고 진행상황·결과보고서를 확인할 수 있습니다.</div>' +
        '<label style="font-size:12px; color:var(--sub); display:block; margin-bottom:8px;">보고서 다운로드 권한 ' +
        '<select id="chMyNewPermission" style="margin-left:4px;"><option value="허용">허용(다운로드 가능)</option><option value="차단">차단(다운로드 불가)</option></select></label>' +
        '<button type="button" id="chMyConnectBtn" class="save-btn">🔗 고객포털 연결하기</button>';
      document.getElementById('chMyConnectBtn').addEventListener('click', function(){
        if (!confirm(c.고객명 + '님을 위한 my.netax.kr 고객포털을 새로 만들까요?')) return;
        var requestedLabels = (c.증빙목록 || []).filter(function(e){ return e.source === 'requested'; }).map(function(e){ return e.label; });
        var permission = document.getElementById('chMyNewPermission').value;
        // 사건 시작 때 이미 만들어둔 폴더(c.폴더ID)를 그대로 넘겨서 my.netax.kr이 별도 폴더를
        // 새로 만들지 않고 재사용하게 한다 — 그래야 고객 업로드가 증빙관리와 같은 폴더에 쌓인다.
        callGas('admin_create_case', { name: c.고객명, case_name: c.사건명, checklist: requestedLabels, permission: permission, folder_id: c.폴더ID || '' }).then(function(res){
          if (res.success === false){ showToast(res.message || '연결 실패', 'error'); return; }
          callGas('work_update_case', { id: c.id, my_report_id: res.report_id }).then(function(){
            showToast('고객포털을 연결했습니다 — 열람번호 ' + res.report_id, 'success');
            loadChCases_();
            if (typeof loadWorkCases === 'function') loadWorkCases();
          });
        }).catch(function(err){ showToast('연결 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
      });
      return;
    }

    box.innerHTML = '<div class="log-empty">불러오는 중…</div>';
    callGas('admin_get_case', { report_id: c.my_report_id }).then(function(res){
      if (res.success === false){
        box.innerHTML = '<div class="log-empty">' + escapeHtml(res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      var mc = res.case;
      var url = 'https://my.netax.kr/?report_id=' + mc.report_id;
      var checklist = mc.checklist || [];
      var status = mc.submission_status || {};
      var rows = checklist.map(function(item){
        var done = status[item] && status[item].submitted;
        return '<div class="log-entry"><div class="log-date" style="color:' + (done ? 'var(--navy)' : 'var(--sub)') + ';">' + (done ? '제출완료' : '미제출') + '</div>' +
          '<div class="log-text">' + escapeHtml(item) + '</div></div>';
      }).join('');
      var extra = status._extra || [];
      box.innerHTML =
        '<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">' +
        '<code style="background:var(--panel); padding:3px 8px; border-radius:6px;">' + escapeHtml(mc.report_id) + '</code>' +
        '<button type="button" id="chMyCopyLinkBtn" class="ghost-btn" style="font-size:12px;">🔗 링크복사</button>' +
        '<button type="button" id="chMySendSmsBtn" class="ghost-btn" style="font-size:12px;">📱 문자로 전달</button>' +
        (mc.has_password ? '' : '<span style="font-size:11px; color:var(--danger); border:1px solid var(--danger); border-radius:10px; padding:1px 7px;">비밀번호 미설정</span>') +
        '</div>' +
        '<div style="font-size:12px; color:var(--sub); margin-bottom:6px;">체크리스트 제출현황</div>' +
        (rows || '<div class="log-empty">체크리스트가 없습니다.</div>') +
        (extra.length ? '<div style="font-size:12px; color:var(--sub); margin-top:8px;">기타 제출 ' + extra.length + '건: ' + escapeHtml(extra.map(function(f){ return f.fileName; }).join(', ')) + '</div>' : '') +
        '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;">' +
        '<input type="text" id="chMyNewItem" placeholder="추가로 요청할 자료명" style="flex:1; min-width:140px;">' +
        '<button type="button" id="chMyAddItemBtn" class="save-btn">추가</button>' +
        '</div>';

      document.getElementById('chMyCopyLinkBtn').addEventListener('click', function(){
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){ showToast('링크를 복사했습니다.', 'success'); });
        else showToast(url, 'success');
      });
      document.getElementById('chMySendSmsBtn').addEventListener('click', function(){
        if (!confirm(c.고객명 + '님께 my.netax.kr 주소와 접근번호를 문자로 보낼까요?')) return;
        var btn = document.getElementById('chMySendSmsBtn');
        btn.disabled = true; btn.textContent = '전송 중…';
        callGas('send_my_portal_sms', { caseId: c.id }).then(function(res){
          btn.disabled = false; btn.textContent = '📱 문자로 전달';
          if (res.success === false){ showToast(res.message || '전송 실패', 'error'); return; }
          showToast('문자를 전송했습니다.', 'success');
        }).catch(function(err){ btn.disabled = false; btn.textContent = '📱 문자로 전달'; showToast('전송 중 오류: ' + (err && err.message ? err.message : err), 'error'); });
      });
      document.getElementById('chMyAddItemBtn').addEventListener('click', function(){
        var label = document.getElementById('chMyNewItem').value.trim();
        if (!label){ showToast('자료명을 입력해주세요.', 'warning'); return; }
        chAddRequestedItem_(c, label, '');
      });
    }).catch(function(err){ box.innerHTML = '<div class="log-empty">불러오는 중 오류: ' + escapeHtml(err && err.message ? err.message : '') + '</div>'; });
  }
</script>
