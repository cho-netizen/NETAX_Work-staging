<script>
  // ============================================================
  // 공용 인프라 — google.script.run 래퍼, 로그인 게이트, 메뉴 라우팅
  // ============================================================

  // manageApp_call(action, payload)를 프라미스로 감싼다. 기존 앱의 callGas(action, payload)와
  // 시그니처를 맞춰서, work-manage.js/client-manage.js 등을 이식할 때 호출부 코드를 그대로 쓸 수 있게 한다.
  function callGas(action, payload){
    return new Promise(function(resolve, reject){
      google.script.run
        .withSuccessHandler(function(res){
          if (res && res.error) reject(new Error(res.error));
          else resolve(res);
        })
        .withFailureHandler(function(err){ reject(err); })
        .manageApp_call(action, payload || {});
    });
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('shown');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove('shown'); }, 2200);
  }
  // work-manage.js/client-manage.js 이식본이 그대로 부르는 이름(showToast(msg, type))으로도 동작하게.
  function showToast(msg, type){ toast(msg); }

  function escapeHtml(s){
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // explorer.js의 짧은 날짜 표시(YYYY-MM-DD → YY-MM-DD) — 표시 전용, 저장값은 그대로 유지.
  function fmtDateShort_(dateStr){
    if (!dateStr) return '';
    return String(dateStr).slice(2);
  }

  // explorer.js/document-tools.js와 동일한 base64 변환 헬퍼 — 증빙관리·메모 이식본에서 공용으로 사용.
  function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
  function uint8ToBase64(bytes){
    var binary = '';
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    return btoa(binary);
  }
  // "고객사건"(기본 작업 폴더) 루트 경로 — 메모의 고객명 매칭 저장, 작업관리 새 사건 등에서
  // 공용으로 쓰는 기준점. listFolder({})는 서버의 기본 폴더(DEFAULT_FOLDER_ID_PROPERTY) 경로를 준다.
  var _customerRootPathCache = null;
  function getCustomerRootPath_(){
    if (_customerRootPathCache) return Promise.resolve(_customerRootPathCache);
    return callGas('listFolder', {}).then(function(res){
      _customerRootPathCache = res.path || [];
      return _customerRootPathCache;
    });
  }

  function formatFileSize(bytes){
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  }

  // AI 사이드바의 요청 context.currentView로 그대로 실려나가는 라벨 — 대화 중 화면을 옮겨도
  // AI가 "지금 어느 화면을 보고 있는지" 알 수 있게 한다.
  // [주의] 아래 로그인 게이트 IIFE가 이미 로그인된 세션이면 곧바로 enterApp()→showView()를
  // 동기 호출하므로, 이 선언은 반드시 그 IIFE보다 앞에 있어야 한다(뒤에 두면 아직 정의되지
  // 않은 변수를 참조해 TypeError가 나고, 그 여파로 initDashboard 등 나머지 초기화가 전부
  // 실행되지 않는 버그가 실제로 발생했었다).
  var VIEW_LABELS_ = {
    dashboard: '대시보드', booking: '예약관리', workmanage: '작업관리', casehandling: '사건처리', clientmanage: '고객관리',
    docs: '증빙관리', taxcalc: '세액계산', reports: '열람관리',
    'memo-text': '일반메모', 'memo-hand': '필기메모', settings: '설정'
  };

  // ---- 로그인 게이트 ----
  (function(){
    var gate = document.getElementById('loginGate');
    var input = document.getElementById('loginPw');
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginErr');
    var STORAGE_KEY = 'nxManageAuthed';

    function tryLogin(){
      var pw = input.value;
      if (!pw){ return; }
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function(ok){
          btn.disabled = false;
          if (ok){
            try{ sessionStorage.setItem(STORAGE_KEY, '1'); }catch(e){}
            enterApp();
          } else {
            err.textContent = '비밀번호가 올바르지 않습니다.';
            input.value = '';
            input.focus();
          }
        })
        .withFailureHandler(function(e){
          btn.disabled = false;
          err.textContent = '확인 중 오류: ' + (e && e.message ? e.message : e);
        })
        .manageApp_checkPassword(pw);
    }
    btn.addEventListener('click', tryLogin);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });

    var already = false;
    try{ already = sessionStorage.getItem(STORAGE_KEY) === '1'; }catch(e){}
    if (already){
      enterApp();
    } else {
      input.focus();
    }
  })();

  function enterApp(){
    document.getElementById('loginGate').classList.add('hidden');
    document.getElementById('appRoot').classList.add('shown');
    if (!enterApp._inited){
      enterApp._inited = true;
      initNav();
      showView('dashboard');
      if (typeof initDashboard === 'function') initDashboard();
      if (typeof initAiSidebar === 'function') initAiSidebar();
      // 작업관리 "새 사건" 폼의 고객명 자동완성(clientNameOptions)이 처음부터 채워져 있도록,
      // 고객관리 화면을 열지 않아도 미리 한 번 받아온다(client-manage.js 원본과 동일한 이유).
      if (typeof loadClients === 'function'){ clientManageLoaded = true; loadClients(); }
    }
  }

  // ---- 메뉴 라우팅 ----
  function initNav(){
    var items = document.querySelectorAll('.menu-item[data-view]');
    items.forEach(function(item){
      item.addEventListener('click', function(){
        var view = item.getAttribute('data-view');
        if (item.classList.contains('soon')){
          toast('이 화면은 다음 단계에서 추가됩니다.');
          return;
        }
        showView(view);
        items.forEach(function(i){ i.classList.remove('active'); });
        item.classList.add('active');
      });
    });
  }

  function showView(name){
    document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
    var target = document.getElementById('view-' + name);
    if (target) target.classList.add('active');
    window._currentViewLabel = VIEW_LABELS_[name] || name;
    if (name === 'booking' && typeof initBooking === 'function') initBooking();
    if (name === 'workmanage' && typeof initWorkManage === 'function') initWorkManage();
    if (name === 'casehandling' && typeof initCaseHandling === 'function') initCaseHandling();
    if (name === 'clientmanage' && typeof initClientManage === 'function') initClientManage();
    if (name === 'docs' && typeof initDocs === 'function') initDocs();
    if (name === 'memo-text' && typeof initMemoText === 'function') initMemoText();
    if (name === 'memo-hand' && typeof initMemoHand === 'function') initMemoHand();
    if (name === 'taxcalc' && typeof initTaxCalc === 'function') initTaxCalc();
    if (name === 'reports' && typeof initReports === 'function') initReports();
    if (name === 'settings' && typeof initSettings === 'function') initSettings();
  }

  // 다른 화면의 버튼에서 메뉴를 직접 클릭한 것처럼 화면을 전환할 때 씀(예: 작업관리 사건
  // 상세의 "이 사건 처리하기" 버튼 → 사건처리 화면으로 이동). showView만 부르면 좌측 메뉴의
  // active 표시가 안 바뀌므로 같이 처리한다.
  function goToView_(name){
    showView(name);
    document.querySelectorAll('.menu-item[data-view]').forEach(function(i){
      i.classList.toggle('active', i.getAttribute('data-view') === name);
    });
  }
</script>
