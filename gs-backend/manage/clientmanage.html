<div class="view" id="view-clientmanage">
  <div class="editor-toolbar">
    <button type="button" id="btnClientNew" class="save-btn">+ 새 고객</button>
    <span class="editor-filename">👤 고객 명단 · 서비스 이력 · 수금관리</span>
    <div class="spacer"></div>
    <input type="text" id="clientSearchInput" placeholder="이름으로 검색…">
  </div>
  <div class="manage-split">
    <div class="manage-split-list"><div id="clientList" class="log-list"></div></div>
    <div class="manage-split-detail" id="clientDetailCol">
      <div id="clientDetail"><div class="explorer-status">왼쪽에서 고객을 선택하거나 "+ 새 고객"을 눌러주세요.</div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="clientQuickViewOverlay" style="display:none;">
  <div class="modal-panel" style="max-width:640px;">
    <div class="modal-head">
      <span>👤 고객정보 빠른보기</span>
      <span class="modal-close" id="btnCloseClientQuickView" title="닫기">✕</span>
    </div>
    <div class="modal-body" id="clientQuickViewMount"></div>
  </div>
</div>

<script>
  // ============================================================
  // 고객관리 — client-manage.js 이식본. work-manage.js와 마찬가지로 로직은 그대로,
  // 새창/탐색창 전환 코드만 이 앱의 메뉴 라우팅에 맞게 걷어냈다.
  // ============================================================
  var clientList = document.getElementById('clientList');
  var clientDetail = document.getElementById('clientDetail');
  var clientSearchInput = document.getElementById('clientSearchInput');
  var clientNameOptions = document.getElementById('clientNameOptions');

  var clients = [];
  var selectedClientId = null;
  var clientShowingNewForm = false;
  var clientManageLoaded = false;

  var CLIENT_TIER_OPTIONS_ = ['로얄', '우수', '보통', '영세'];

  function formatPhoneInput_(raw){
    var digits = String(raw || '').replace(/\D/g, '').slice(0, 11);
    if (digits.length < 4) return digits;
    if (digits.length < 8) return digits.slice(0, 3) + '-' + digits.slice(3);
    if (digits.indexOf('02') === 0){
      if (digits.length <= 9) return digits.slice(0, 2) + '-' + digits.slice(2, 5) + '-' + digits.slice(5);
      return digits.slice(0, 2) + '-' + digits.slice(2, 6) + '-' + digits.slice(6, 10);
    }
    if (digits.length <= 10) return digits.slice(0, 3) + '-' + digits.slice(3, 6) + '-' + digits.slice(6);
    return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7, 11);
  }

  function initClientManage(){
    if (clientManageLoaded) return;
    clientManageLoaded = true;
    loadClients();
  }

  function loadClientsQuiet_(){ updateClientNameOptions_(); }

  function loadClients(){
    clientList.innerHTML = '<div class="log-empty">불러오는 중…</div>';
    callGas('client_get_clients', { search: clientSearchInput ? clientSearchInput.value.trim() : '' }).then(function(res){
      if (res.error || res.success === false){
        clientList.innerHTML = '<div class="log-empty">' + escapeHtml(res.error || res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      clients = res.clients || [];
      renderClientList();
      updateClientNameOptions_();
      if (selectedClientId){
        var still = clients.filter(function(c){ return c.id === selectedClientId; })[0];
        if (still) { renderClientDetail(still); return; }
      }
      var inQuickView = clientDetail && clientDetail.parentElement && clientDetail.parentElement.id === 'clientQuickViewMount';
      if (!clientShowingNewForm && clientDetail && !inQuickView){
        clientDetail.innerHTML = '<div class="explorer-status">왼쪽에서 고객을 선택하거나 "+ 새 고객"을 눌러주세요.</div>';
      }
    }).catch(function(){
      clientList.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>';
    });
  }

  function updateClientNameOptions_(){
    if (!clientNameOptions) return;
    var p = (clientSearchInput && clientSearchInput.value.trim()) ? callGas('client_get_clients', {}) : Promise.resolve({ clients: clients });
    p.then(function(res){
      var all = res.clients || [];
      clientNameOptions.innerHTML = '';
      all.forEach(function(c){
        if (!c.성명) return;
        var opt = document.createElement('option');
        opt.value = c.성명;
        clientNameOptions.appendChild(opt);
      });
    }).catch(function(){});
  }

  function renderClientList(){
    clientList.innerHTML = '';
    if (!clients.length){
      clientList.innerHTML = '<div class="log-empty">등록된 고객이 없습니다.</div>';
      return;
    }
    clients.slice().sort(function(a, b){ return (a.성명 || '').localeCompare(b.성명 || '', 'ko'); }).forEach(function(c){
      var row = document.createElement('div');
      row.className = 'log-entry';
      row.style.cursor = 'pointer';
      if (c.id === selectedClientId) row.style.outline = '2px solid var(--navy)';
      row.innerHTML =
        '<div class="log-text"><b>' + escapeHtml(c.성명 || '') + '</b>' +
        (c.전화번호 ? ' · ' + escapeHtml(c.전화번호) : '') +
        (c.구분 ? '<br><span style="color:var(--sub); font-size:12px;">' + escapeHtml(c.구분) + '</span>' : '') +
        '</div>';
      row.addEventListener('click', function(){ clientShowingNewForm = false; selectedClientId = c.id; renderClientList(); renderClientDetail(c); });
      clientList.appendChild(row);
    });
  }

  function renderNewClientForm(){
    clientShowingNewForm = true;
    selectedClientId = null;
    renderClientList();
    clientDetail.innerHTML =
      '<h3 style="margin-top:0;">새 고객 등록</h3>' +
      '<div style="display:flex; flex-direction:column; gap:8px; max-width:380px;">' +
      '<label>성명<br><input type="text" id="ccNewName" style="width:100%;" placeholder="고객 성명"></label>' +
      '<label>전화번호<br><input type="text" id="ccNewPhone" style="width:100%;" placeholder="(선택)"></label>' +
      '<label>구분<br><select id="ccNewType" style="width:100%;">' + CLIENT_TIER_OPTIONS_.map(function(t){ return '<option value="' + t + '"' + (t === '보통' ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
      '<label>납세번호<br><input type="text" id="ccNewBiz" style="width:100%;" placeholder="(선택)"></label>' +
      '<label>메모<br><textarea id="ccNewMemo" style="width:100%; min-height:60px; font-family:inherit;" placeholder="(선택)"></textarea></label>' +
      '<div style="display:flex; gap:8px; margin-top:8px;">' +
      '<button type="button" id="ccNewSave" class="save-btn">저장</button>' +
      '<button type="button" id="ccNewCancel" class="ghost-btn">취소</button>' +
      '</div></div>';

    document.getElementById('ccNewPhone').addEventListener('input', function(e){ e.target.value = formatPhoneInput_(e.target.value); });

    document.getElementById('ccNewCancel').addEventListener('click', function(){
      clientShowingNewForm = false;
      clientDetail.innerHTML = '<div class="explorer-status">왼쪽에서 고객을 선택하거나 "+ 새 고객"을 눌러주세요.</div>';
    });
    document.getElementById('ccNewSave').addEventListener('click', function(){
      var 성명 = document.getElementById('ccNewName').value.trim();
      if (!성명){ showToast('성명을 입력해주세요.', 'warning'); return; }
      callGas('client_create_client', {
        성명: 성명, 전화번호: document.getElementById('ccNewPhone').value.trim(),
        구분: document.getElementById('ccNewType').value.trim(),
        사업자번호: document.getElementById('ccNewBiz').value.trim(),
        메모: document.getElementById('ccNewMemo').value.trim()
      }).then(function(res){
        if (res.error || res.success === false){ showToast(res.error || res.message || '저장 실패', 'error'); return; }
        showToast('고객을 등록했습니다.', 'success');
        clientShowingNewForm = false;
        selectedClientId = res.client.id;
        loadClients();
      }).catch(function(){ showToast('저장 중 오류가 발생했습니다.', 'error'); });
    });
  }

  function renderClientDetail(c){
    clientDetail.innerHTML =
      '<div style="display:flex; justify-content:space-between; align-items:flex-start;">' +
      '<input type="text" id="ccEditName" placeholder="성명" value="' + escapeHtml(c.성명 || '') + '" style="font-weight:700; font-size:15px; flex:1; min-width:0; margin-right:8px;">' +
      '<button type="button" id="ccDeleteClient" class="ghost-btn" title="삭제">🗑 삭제</button>' +
      '</div>' +
      '<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px;">' +
      '<input type="text" id="ccEditPhone" placeholder="전화번호" value="' + escapeHtml(c.전화번호 || '') + '" style="width:130px;">' +
      '<select id="ccEditType" style="width:100px;">' + CLIENT_TIER_OPTIONS_.map(function(t){ return '<option value="' + t + '"' + (t === (c.구분 || '보통') ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
      '<input type="text" id="ccEditBiz" placeholder="납세번호" value="' + escapeHtml(c.사업자번호 || '') + '" style="width:130px;">' +
      '<button type="button" id="ccSaveClient" class="ghost-btn">저장</button>' +
      '</div>' +
      '<textarea id="ccEditMemo" placeholder="메모" style="width:100%; max-width:500px; min-height:50px; font-family:inherit; margin-bottom:16px;">' + escapeHtml(c.메모 || '') + '</textarea>' +
      '<h4 style="margin-bottom:6px;">서비스 이력</h4>' +
      '<div id="ccLogList" class="log-list"><div class="log-empty">불러오는 중…</div></div>' +
      '<h4 id="ccPaymentToggle" style="margin-bottom:6px; margin-top:18px; cursor:pointer; width:fit-content;" title="눌러서 수금 내역 추가">➕ 수금관리</h4>' +
      '<div id="ccPaymentList" class="log-list"><div class="log-empty">불러오는 중…</div></div>' +
      '<div id="ccNewPaymentFormWrap" style="display:none; margin-top:10px; gap:6px; flex-wrap:wrap; align-items:center;"></div>';

    document.getElementById('ccEditPhone').addEventListener('input', function(e){ e.target.value = formatPhoneInput_(e.target.value); });

    document.getElementById('ccSaveClient').addEventListener('click', function(){
      var name = document.getElementById('ccEditName').value.trim();
      if (!name){ showToast('성명은 비워둘 수 없습니다.', 'warning'); return; }
      callGas('client_update_client', {
        id: c.id, 성명: name,
        전화번호: document.getElementById('ccEditPhone').value.trim(),
        구분: document.getElementById('ccEditType').value.trim(),
        사업자번호: document.getElementById('ccEditBiz').value.trim(),
        메모: document.getElementById('ccEditMemo').value.trim()
      }).then(function(res){
        if (res.error || res.success === false){ showToast(res.error || res.message || '저장 실패', 'error'); return; }
        showToast('저장했습니다.', 'success');
        loadClients();
        if (quickViewSnapshot_ !== null) quickViewSnapshot_ = quickViewCurrentSignature_();
      }).catch(function(){ showToast('저장 중 오류가 발생했습니다.', 'error'); });
    });

    document.getElementById('ccDeleteClient').addEventListener('click', function(){
      if (!confirm('"' + c.성명 + '" 고객을 삭제할까요? 수금 내역은 남아있지만 이 고객과의 연결은 끊어집니다.')) return;
      callGas('client_delete_client', { id: c.id }).then(function(res){
        if (res.error || res.success === false){ showToast(res.error || res.message || '삭제 실패', 'error'); return; }
        selectedClientId = null;
        showToast('삭제했습니다.', 'success');
        loadClients();
      }).catch(function(){ showToast('삭제 중 오류가 발생했습니다.', 'error'); });
    });

    var newPaymentFormWrap = document.getElementById('ccNewPaymentFormWrap');
    document.getElementById('ccPaymentToggle').addEventListener('click', function(){
      if (newPaymentFormWrap.style.display === 'none'){
        newPaymentFormWrap.style.display = 'flex';
        newPaymentFormWrap.innerHTML =
          '<input type="date" id="ccNewPayDate" title="날짜(생략하면 오늘)">' +
          '<input type="number" id="ccNewPayAmount" placeholder="금액" style="width:110px;">' +
          '<select id="ccNewPayReceipt">' +
          '<option value="">수취증빙 선택</option>' +
          '<option value="현금영수증">현금영수증</option>' +
          '<option value="세금계산서">세금계산서</option>' +
          '<option value="신용카드">신용카드</option>' +
          '</select>' +
          '<button type="button" id="ccAddPayment" class="save-btn">추가</button>' +
          '<button type="button" id="ccAddPaymentCancel" class="ghost-btn">취소</button>';
        document.getElementById('ccAddPaymentCancel').addEventListener('click', function(){ newPaymentFormWrap.style.display = 'none'; newPaymentFormWrap.innerHTML = ''; });
        document.getElementById('ccAddPayment').addEventListener('click', function(){
          var amount = document.getElementById('ccNewPayAmount').value;
          if (!amount){ showToast('금액을 입력해주세요.', 'warning'); return; }
          callGas('client_add_consult_log', {
            고객ID: c.id, 고객명: c.성명,
            날짜: document.getElementById('ccNewPayDate').value,
            금액: amount,
            수취증빙: document.getElementById('ccNewPayReceipt').value
          }).then(function(res){
            if (res.error || res.success === false){ showToast(res.error || res.message || '추가 실패', 'error'); return; }
            showToast('수금 내역을 추가했습니다.', 'success');
            newPaymentFormWrap.style.display = 'none';
            newPaymentFormWrap.innerHTML = '';
            loadClientPayments_(c);
          }).catch(function(){ showToast('추가 중 오류가 발생했습니다.', 'error'); });
        });
      } else {
        newPaymentFormWrap.style.display = 'none';
        newPaymentFormWrap.innerHTML = '';
      }
    });

    loadClientLogs_(c);
    loadClientPayments_(c);
  }

  function loadClientLogs_(c){
    var listEl = document.getElementById('ccLogList');
    if (!listEl) return;
    callGas('work_get_cases', {}).then(function(res){
      if (res.error || res.success === false){
        listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error || res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      var cases = (res.cases || []).filter(function(wc){ return wc.고객ID === c.id; });
      if (!cases.length){
        listEl.innerHTML = '<div class="log-empty">아직 이력이 없습니다.</div>';
        return;
      }
      cases.sort(function(a, b){ return (b.의뢰일 || b.수정일 || '').localeCompare(a.의뢰일 || a.수정일 || ''); });
      listEl.innerHTML = '';
      cases.forEach(function(wc){
        var row = document.createElement('div');
        row.className = 'log-entry';
        renderCaseHistoryRow_(row, wc);
        listEl.appendChild(row);
      });
    }).catch(function(){
      listEl.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>';
    });
  }

  function renderCaseHistoryRow_(row, wc){
    var semokLabel = (typeof WORK_SEMOK_LABELS !== 'undefined' && WORK_SEMOK_LABELS[wc.세목]) || wc.세목 || '';
    var deadlineLabel = typeof workDeadlineFieldLabel_ === 'function' ? workDeadlineFieldLabel_(wc.업무유형) : '법정일';
    row.innerHTML =
      '<div class="log-date">' + escapeHtml(wc.의뢰일 ? fmtDateShort_(wc.의뢰일) : '') + '</div>' +
      '<div class="log-text">' +
      '🗂 <b>' + escapeHtml(wc.사건명 || '') + '</b> · ' + escapeHtml(semokLabel) + (wc.업무유형 ? ' · ' + escapeHtml(wc.업무유형) : '') +
      ' · <span style="color:' + (wc.상태 === '완료' ? '#16a34a' : 'var(--sub)') + ';">' + escapeHtml(wc.상태 || '') + '</span>' +
      (wc.법정일 ? '<br>' + escapeHtml(deadlineLabel) + ': ' + escapeHtml(fmtDateShort_(wc.법정일)) : '') +
      '</div>';
  }

  function loadClientPayments_(c){
    var listEl = document.getElementById('ccPaymentList');
    if (!listEl) return;
    callGas('client_get_consult_logs', { 고객ID: c.id }).then(function(res){
      if (res.error || res.success === false){
        listEl.innerHTML = '<div class="log-empty">' + escapeHtml(res.error || res.message || '불러오지 못했습니다.') + '</div>';
        return;
      }
      var payments = res.logs || [];
      if (!payments.length){
        listEl.innerHTML = '<div class="log-empty">아직 수금 내역이 없습니다.</div>';
        return;
      }
      listEl.innerHTML = '';
      payments.forEach(function(pay){
        var row = document.createElement('div');
        row.className = 'log-entry';
        renderPaymentRowView_(row, c, pay);
        listEl.appendChild(row);
      });
    }).catch(function(){
      listEl.innerHTML = '<div class="log-empty">불러오지 못했습니다.</div>';
    });
  }

  function renderPaymentRowView_(row, c, pay){
    var amountText = pay.금액 ? Number(pay.금액).toLocaleString('ko-KR') + '원' : '';
    row.innerHTML =
      '<div class="log-date">' + escapeHtml(fmtDateShort_(pay.날짜)) + '</div>' +
      '<div class="log-text">' + escapeHtml(amountText) + (pay.수취증빙 ? ' · ' + escapeHtml(pay.수취증빙) : '') + '</div>' +
      '<span class="log-edit" title="수정" style="cursor:pointer; margin-right:6px;">✏️</span>' +
      '<span class="log-del" title="삭제">✕</span>';
    row.querySelector('.log-edit').addEventListener('click', function(){ renderPaymentRowEdit_(row, c, pay); });
    row.querySelector('.log-del').addEventListener('click', function(){
      if (!confirm('이 수금 내역을 삭제할까요?')) return;
      callGas('client_delete_consult_log', { id: pay.id }).then(function(delRes){
        if (delRes.error || delRes.success === false){ showToast(delRes.error || delRes.message || '삭제 실패', 'error'); return; }
        loadClientPayments_(c);
      }).catch(function(){ showToast('삭제 중 오류가 발생했습니다.', 'error'); });
    });
  }

  function renderPaymentRowEdit_(row, c, pay){
    var receiptOptions = ['', '현금영수증', '세금계산서', '신용카드'];
    row.innerHTML =
      '<div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center; width:100%;">' +
      '<input type="date" class="payEditDate" value="' + escapeHtml(pay.날짜 || '') + '" style="font-size:12px;">' +
      '<input type="number" class="payEditAmount" placeholder="금액" value="' + (pay.금액 || '') + '" style="width:110px; font-size:12px;">' +
      '<select class="payEditReceipt" style="font-size:12px;">' +
      receiptOptions.map(function(o){ return '<option value="' + o + '"' + (o === (pay.수취증빙 || '') ? ' selected' : '') + '>' + (o || '수취증빙 선택') + '</option>'; }).join('') +
      '</select>' +
      '<button type="button" class="save-btn payEditSave" style="padding:3px 8px;">저장</button>' +
      '<button type="button" class="ghost-btn payEditCancel" style="padding:3px 8px;">취소</button>' +
      '</div>';
    row.querySelector('.payEditCancel').addEventListener('click', function(){ renderPaymentRowView_(row, c, pay); });
    row.querySelector('.payEditSave').addEventListener('click', function(){
      var amount = row.querySelector('.payEditAmount').value;
      if (!amount){ showToast('금액을 입력해주세요.', 'warning'); return; }
      callGas('client_update_consult_log', {
        id: pay.id,
        날짜: row.querySelector('.payEditDate').value,
        금액: amount,
        수취증빙: row.querySelector('.payEditReceipt').value
      }).then(function(res){
        if (res.error || res.success === false){ showToast(res.error || res.message || '저장 실패', 'error'); return; }
        showToast('저장했습니다.', 'success');
        loadClientPayments_(c);
      }).catch(function(){ showToast('저장 중 오류가 발생했습니다.', 'error'); });
    });
  }

  document.getElementById('btnClientNew').addEventListener('click', renderNewClientForm);
  clientSearchInput.addEventListener('input', function(){ loadClients(); });

  // ---- 고객정보 빠른보기 팝업 (작업관리 사건 상세의 👤 버튼에서 호출) ----
  var quickViewSnapshot_ = null;
  function quickViewCurrentSignature_(){
    var ids = ['ccEditName', 'ccEditPhone', 'ccEditType', 'ccEditBiz', 'ccEditMemo'];
    return ids.map(function(id){ var el = document.getElementById(id); return el ? el.value : ''; }).join('');
  }

  function openClientQuickView_(clientId){
    if (!clientId){ showToast('이 사건에 연결된 고객 정보가 없습니다.', 'warning'); return; }
    var found = clients.filter(function(c){ return c.id === clientId; })[0];
    var p = found ? Promise.resolve(found) : callGas('client_get_clients', {}).then(function(res){
      return (res.clients || []).filter(function(c){ return c.id === clientId; })[0];
    }).catch(function(){ return null; });
    p.then(function(f){
      if (!f){ showToast('연결된 고객 정보를 찾을 수 없습니다.', 'error'); return; }
      var overlay = document.getElementById('clientQuickViewOverlay');
      document.getElementById('clientQuickViewMount').appendChild(clientDetail);
      overlay.style.display = 'flex';
      renderClientDetail(f);
      quickViewSnapshot_ = quickViewCurrentSignature_();
    });
  }

  function closeClientQuickView_(){
    if (quickViewSnapshot_ !== null && quickViewCurrentSignature_() !== quickViewSnapshot_){
      if (!confirm('저장하지 않은 수정 내용이 있습니다. 저장하지 않고 닫을까요?')) return;
    }
    quickViewSnapshot_ = null;
    document.getElementById('clientQuickViewOverlay').style.display = 'none';
    var clientDetailCol = document.getElementById('clientDetailCol');
    if (clientDetailCol) clientDetailCol.appendChild(clientDetail);
  }

  document.getElementById('btnCloseClientQuickView').addEventListener('click', closeClientQuickView_);
  document.getElementById('clientQuickViewOverlay').addEventListener('click', function(e){
    if (e.target === document.getElementById('clientQuickViewOverlay')) closeClientQuickView_();
  });
</script>
