  <script>
    // report-writer 편집기 — 기존 채팅앱과 같은 GAS 백엔드를 공유하는 별도 정적 페이지.
    // 이 관리 앱은 script.google.com에서 서빙되어 origin이 다르므로 절대주소로 연다.
    var REPORT_WRITER_URL = 'https://work.netax.kr/report-writer/';
    document.querySelectorAll('.menu-item[data-action="open-report-writer"]').forEach(function(el){
      el.addEventListener('click', function(){ window.open(REPORT_WRITER_URL, '_blank'); });
    });

    // AI 사이드바 — 접힌 14px 스트립을 클릭하면 펼쳐진다(펼친 뒤에는 안의 입력창·버튼
    // 클릭이 다시 접히지 않도록, 이미 펼쳐진 상태면 이 리스너는 아무것도 하지 않는다 —
    // 접는 건 패널 안의 ≫ 버튼(aisidebar.html)만 담당).
    document.getElementById('sideAI').addEventListener('click', function(){
      if (!this.classList.contains('expanded')) this.classList.add('expanded');
    });
  </script>
