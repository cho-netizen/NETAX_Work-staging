<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>NETAX work 은퇴 안내</title>
<link rel="manifest" href="/manifest.json">
<!-- [2026-10-20] work.netax.kr 은퇴.
     이 페이지는 안내만 보여 준다. 서버(Apps Script)를 부르는 스크립트는 하나도 불러오지 않는다.
     옛 화면 코드(core.js·chat.js 등)는 저장소에 남아 있지만 어느 페이지도 더 이상 불러오지 않는다.
     옛 코드는 git 기록에서 볼 수 있다. -->
<style>
  :root { --bg:#f4f6fa; --card:#ffffff; --text:#1b2a41; --muted:#5a6475; --accent:#1b4fa0; --line:#d9dee8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1b3d; --card:#16264d; --text:#eef1f7; --muted:#b4bccb; --accent:#8fb4ff; --line:#2a3b66; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); padding:16px;
         font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  .card { max-width:520px; width:100%; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:28px 24px; text-align:center; }
  h1 { font-size:1.35rem; margin:0 0 12px; }
  p { margin:0 0 18px; line-height:1.6; color:var(--muted); word-break:keep-all; }
  a.go { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
         padding:12px 22px; border-radius:10px; font-weight:600; }
  @media (prefers-color-scheme: dark) { a.go { color:#0d1b3d; } }
</style>
</head>
<body>
<main class="card">
  <h1>NETAX work는 은퇴했습니다</h1>
  <p>NETAX work는 은퇴했습니다 — <a href="https://job.netax.kr/app/">job.netax.kr/app/</a> 에서 여세요.</p>
  <a class="go" href="https://job.netax.kr/app/">job.netax.kr/app/ 열기</a>
</main>
<script>
  // 예전에 설치된 앱(PWA)의 서비스워커와 저장 캐시를 정리한다. 서버는 부르지 않는다.
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if ('caches' in window) {
      caches.keys().then(function (ks) {
        ks.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
  } catch (e) {}
</script>
</body>
</html>
